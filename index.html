<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Empire Conquest: Bryyce Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Oswald:wght@700&display=swap');
        
        body { background-color: #020202; font-family: 'Oswald', sans-serif; }
        .royal { font-family: 'Cinzel', serif; }

        /* ANIMATIONS */
        @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .hero-float { animation: hover 3s ease-in-out infinite; }
        
        @keyframes strike { 
            0% { transform: translateX(0); } 
            20% { transform: translateX(20px) rotate(10deg); } 
            100% { transform: translateX(0); } 
        }
        .attack-anim { animation: strike 0.4s ease-in-out; }

        .gold-border { border: 3px solid #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .map-tile { background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png'); }
    </style>
</head>
<body class="text-white overflow-hidden select-none">

    <div class="h-24 bg-gradient-to-b from-[#3a2a1a] to-[#1a1108] border-b-[3px] border-[#ffd700] flex items-center justify-between px-6 z-50 relative">
        <div class="flex items-center gap-4">
            <div class="relative">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=KingBryyce" class="w-16 h-16 rounded-full gold-border bg-slate-800 hero-float">
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-[#ffd700] text-black text-[10px] px-2 font-black rounded-full border-2 border-black">VIP 12</div>
            </div>
            <div>
                <h1 class="royal text-[#ffd700] text-2xl tracking-widest leading-none">LORD BRYYCE</h1>
                <div class="flex gap-1 mt-1">
                    <div class="w-4 h-4 bg-red-600 rounded-sm"></div>
                    <div class="w-4 h-4 bg-red-600 rounded-sm"></div>
                    <div class="w-4 h-4 bg-gray-600 rounded-sm"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-1 items-end">
            <div class="flex gap-4">
                <div class="bg-black/60 border-2 border-cyan-500 rounded-md px-4 py-1 flex items-center gap-3">
                    <img src="https://cdn-icons-png.flaticon.com/512/209/209931.png" class="w-5 h-5">
                    <span class="text-cyan-400 font-bold text-lg" id="gemDisplay">50,000</span>
                </div>
                <div class="bg-black/60 border-2 border-green-500 rounded-md px-4 py-1 flex items-center gap-3">
                    <img src="https://cdn-icons-png.flaticon.com/512/3133/3133463.png" class="w-5 h-5">
                    <span class="text-green-400 font-bold text-lg">1.2M</span>
                </div>
            </div>
            <button onclick="powerUp()" class="text-[10px] text-yellow-500 font-bold hover:text-white transition uppercase tracking-tighter">↑ Increase Power</button>
        </div>
    </div>

    <div class="flex h-[calc(100vh-96px)]">
        
        <div class="w-20 bg-black/40 border-r border-[#ffd700]/20 flex flex-col items-center py-6 gap-8">
            <button class="w-12 h-12 bg-yellow-600/20 rounded-xl border border-yellow-500 flex items-center justify-center text-2xl">🛡️</button>
            <button class="w-12 h-12 bg-blue-600/20 rounded-xl border border-blue-500 flex items-center justify-center text-2xl">⚔️</button>
            <button class="w-12 h-12 bg-green-600/20 rounded-xl border border-green-500 flex items-center justify-center text-2xl">🏹</button>
            <button class="w-12 h-12 bg-purple-600/20 rounded-xl border border-purple-500 flex items-center justify-center text-2xl">🔥</button>
        </div>

        <div class="flex-1 relative bg-[#2a3d2a] overflow-hidden">
            <div id="map" class="absolute w-[2000px] h-[2000px] grid grid-cols-20 grid-rows-20 transition-transform duration-700 ease-out">
                </div>
            
            <div class="absolute bottom-10 right-10 flex flex-col items-center gap-2">
                <div class="grid grid-cols-3 gap-2 p-4 bg-black/60 rounded-full gold-border shadow-2xl">
                    <div=""></div>
                    <button onclick="move(0,-1)" class="w-12 h-12 bg-yellow-600 rounded-lg shadow-lg active:scale-95 transition">▲</button>
                    <div=""></div>
                    <button onclick="move(-1,0)" class="w-12 h-12 bg-yellow-600 rounded-lg shadow-lg active:scale-95 transition">◀</button>
                    <button onclick="move(0,1)" class="w-12 h-12 bg-yellow-600 rounded-lg shadow-lg active:scale-95 transition">▼</button>
                    <button onclick="move(1,0)" class="w-12 h-12 bg-yellow-600 rounded-lg shadow-lg active:scale-95 transition">▶</button>
                </div>
            </div>
        </div>
    </div>

    <div id="battleScreen" class="hidden fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-10">
        <h2 class="royal text-red-600 text-6xl mb-12 italic font-black">BATTLE COMMENCED</h2>
        <div class="flex items-center gap-20">
            <div class="flex flex-col items-center gap-4">
                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" id="pSprite" class="w-48 hero-float drop-shadow-[0_0_30px_cyan]">
                <p class="royal text-cyan-400 text-2xl">Lord Bryyce</p>
            </div>
            <div class="text-7xl font-black text-white italic">VS</div>
            <div class="flex flex-col items-center gap-4">
                <img src="https://cdn-icons-png.flaticon.com/512/2829/2829816.png" class="w-48 hero-float drop-shadow-[0_0_30px_red]">
                <p class="royal text-red-600 text-2xl">Dark Nest Guard</p>
            </div>
        </div>
        <button onclick="closeBattle()" class="mt-20 bg-white text-black px-12 py-4 rounded-full font-black text-2xl hover:bg-red-600 hover:text-white transition">FINISH BATTLE</button>
    </div>

    <script>
        const map = document.getElementById('map');
        let p = { x: 5, y: 5 };
        let gems = 50000;

        function init() {
            map.innerHTML = '';
            map.style.gridTemplateColumns = `repeat(20, 1fr)`;
            
            for(let y=0; y<20; y++) {
                for(let x=0; x<20; x++) {
                    const tile = document.createElement('div');
                    tile.className = "w-[100px] h-[100px] border border-black/10 flex items-center justify-center relative map-tile";
                    
                    if(x === p.x && y === p.y) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-16 drop-shadow-2xl z-20">`;
                    } else if((x+y)%13 === 0) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/2829/2829816.png" class="w-16 opacity-80 cursor-pointer hover:scale-125 transition" onclick="triggerBattle()">`;
                    } else if((x*y)%17 === 0) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/616/616490.png" class="w-12 opacity-30">`;
                    }
                    map.appendChild(tile);
                }
            }
            map.style.transform = `translate(${(5-p.x)*100}px, ${(5-p.y)*100}px)`;
        }

        function move(dx, dy) {
            p.x = Math.max(0, Math.min(19, p.x + dx));
            p.y = Math.max(0, Math.min(19, p.y + dy));
            init();
        }

        function triggerBattle() {
            document.getElementById('battleScreen').classList.remove('hidden');
            const sprite = document.getElementById('pSprite');
            setInterval(() => sprite.classList.toggle('attack-anim'), 800);
        }

        function closeBattle() {
            document.getElementById('battleScreen').classList.add('hidden');
            gems += 5000;
            document.getElementById('gemDisplay').innerText = gems.toLocaleString();
        }

        function powerUp() {
            alert("Power Level Increasing! ⚔️ +150,000");
        }

        init();
    </script>
</body>
</html>
