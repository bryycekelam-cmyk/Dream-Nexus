<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Empire War: Lords Mobile Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;900&display=swap');
        .game-font { font-family: 'Roboto', sans-serif; }
        .royal-font { font-family: 'Cinzel', serif; }
        .map-grid { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
        .castle-shadow { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
    </style>
</head>
<body class="bg-black text-white game-font overflow-hidden select-none">

    <div class="h-20 bg-gradient-to-b from-[#b8860b] to-[#8b4513] border-b-4 border-black flex items-center justify-between px-4 z-50 relative shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-14 h-14 border-2 border-white rounded shadow-lg bg-slate-900 overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Warrior" alt="Avatar">
            </div>
            <div>
                <h1 class="royal-font text-yellow-200 text-lg italic leading-none shadow-sm">LORD BRYYCE</h1>
                <div class="mt-1 flex items-center gap-2">
                    <span class="text-[10px] font-bold text-white uppercase">Lv. 12</span>
                    <div class="w-24 h-2 bg-black rounded-full border border-gray-400 overflow-hidden">
                        <div class="bg-blue-500 h-full" style="width: 70%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-2">
            <div class="bg-black/40 border border-cyan-400 rounded-lg px-3 py-1 flex items-center gap-2">
                <span class="text-cyan-300 font-black">💎 <span id="gemCount">1000</span></span>
            </div>
            <button onclick="upgradeCastle()" class="bg-green-600 border-b-4 border-green-900 px-4 py-1 rounded font-black text-xs hover:bg-green-500">UPGRADE</button>
        </div>
    </div>

    <div id="gameScreen" class="relative w-full h-[calc(100vh-280px)] bg-[#2e4d2e] overflow-hidden">
        <div class="absolute inset-0 opacity-20" style="background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');"></div>
        
        <div id="worldMap" class="map-grid w-[1000px] h-[1000px] transition-all duration-300 ease-out p-4">
            </div>
    </div>

    <div id="gameLog" class="h-12 bg-black/80 flex items-center px-4 text-xs italic text-yellow-500 border-t border-yellow-900/50">
        Welcome back, My Lord. Your kingdom awaits.
    </div>

    <div class="h-44 bg-[#1a1a1a] border-t-4 border-black grid grid-cols-3 gap-2 p-4">
        <div class="grid grid-cols-3 gap-1 h-fit">
            <div=""></div>
            <button onclick="move(0, -1)" class="bg-gray-700 w-10 h-10 rounded shadow-md border-b-4 border-gray-900 flex items-center justify-center">▲</button>
            <div=""></div>
            <button onclick="move(-1, 0)" class="bg-gray-700 w-10 h-10 rounded shadow-md border-b-4 border-gray-900 flex items-center justify-center">◀</button>
            <button onclick="move(0, 1)" class="bg-gray-700 w-10 h-10 rounded shadow-md border-b-4 border-gray-900 flex items-center justify-center">▼</button>
            <button onclick="move(1, 0)" class="bg-gray-700 w-10 h-10 rounded shadow-md border-b-4 border-gray-900 flex items-center justify-center">▶</button>
        </div>

        <div class="flex flex-col gap-2">
            <button onclick="recruit()" class="h-full bg-red-800 border-b-4 border-red-950 rounded-xl font-black text-white flex flex-col items-center justify-center shadow-lg active:translate-y-1 transition-all">
                <span class="text-2xl">⚔️</span>
                <span class="text-[10px] tracking-widest">TRAIN TROOPS</span>
            </button>
        </div>

        <div class="flex flex-col gap-2">
            <div class="bg-gray-800 p-2 rounded border border-gray-600 text-[10px]">
                <p class="text-yellow-400 font-bold uppercase">Quest:</p>
                <p id="currentQuest">Occupy a resource tile</p>
            </div>
            <button onclick="toggleSettings()" class="bg-gray-600 p-2 rounded text-[10px] font-bold">⚙️ SETTINGS</button>
        </div>
    </div>

    <script>
        let gems = 1000;
        let playerPos = { x: 5, y: 5 };
        const mapSize = 10;
        const worldMap = document.getElementById('worldMap');
        const log = document.getElementById('gameLog');

        function initMap() {
            worldMap.innerHTML = '';
            for (let y = 0; y < mapSize; y++) {
                for (let x = 0; x < mapSize; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'border border-white/5 flex items-center justify-center relative bg-green-900/20';
                    
                    if (x === playerPos.x && y === playerPos.y) {
                        tile.innerHTML = `
                            <div class="castle-shadow animate-bounce">
                                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-12 h-12">
                            </div>`;
                    } else if ((x+y) % 7 === 0) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/616/616490.png" class="w-8 opacity-30">`;
                    }
                    worldMap.appendChild(tile);
                }
            }
            // Move map to center player
            const offsetX = (playerPos.x * -100) + (window.innerWidth / 2) - 50;
            const offsetY = (playerPos.y * -100) + (window.innerHeight / 4);
            worldMap.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }

        function move(dx, dy) {
            playerPos.x = Math.max(0, Math.min(mapSize - 1, playerPos.x + dx));
            playerPos.y = Math.max(0, Math.min(mapSize - 1, playerPos.y + dy));
            log.innerText = `Marching to X:${playerPos.x} Y:${playerPos.y}...`;
            initMap();
        }

        function upgradeCastle() {
            if (gems >= 500) {
                gems -= 500;
                document.getElementById('gemCount').innerText = gems;
                log.innerText = "Construction Complete! Castle upgraded to Level 13.";
                alert("Castle Upgraded!");
            } else {
                alert("Insufficient Gems!");
            }
        }

        function recruit() {
            log.innerText = "Recruiting 100 Royal Guards...";
            setTimeout(() => { log.innerText = "Troops ready for battle!"; }, 2000);
        }

        function toggleSettings() {
            const vol = prompt("Enter Volume (0-100):", "80");
            if (vol) log.innerText = `System volume set to ${vol}%.`;
        }

        initMap();
    </script>
</body>
</html>
