<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROB | Private Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #0d0d0d, #050505);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15%;
            scroll-behavior: smooth;
        }

        .input-area {
            padding: 24px 15% 40px 15%;
            background: linear-gradient(transparent, #050505 30%);
        }

        .input-wrapper {
            background: #111111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            padding: 8px;
            outline: none;
            font-size: 15px;
        }

        .message {
            margin-bottom: 32px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .rob-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #333, #111);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; color: #aaa;
            border: 1px solid #444;
        }

        /* Mono for code or system bits */
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center">
                <span class="text-black font-black text-xl">R</span>
            </div>
            <div>
                <h1 class="font-semibold tracking-tight text-lg">ROB</h1>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mono">Private Intel</p>
            </div>
        </div>

        <nav class="flex-1 space-y-2">
            <div class="p-3 bg-white/5 rounded-lg border border-white/10 text-xs font-medium cursor-pointer">Current Session</div>
            <div class="p-3 hover:bg-white/5 rounded-lg text-xs text-gray-500 cursor-not-allowed">Archives</div>
            <div class="p-3 hover:bg-white/5 rounded-lg text-xs text-gray-500 cursor-not-allowed">System Logs</div>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <p class="text-[10px] text-gray-600 mono uppercase mb-2">Authenticated User</p>
            <p class="text-xs font-bold text-gray-300 uppercase">Lord Bryyce</p>
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-container" id="chat-box">
            <div class="message">
                <div class="flex items-center gap-3 mb-3">
                    <div class="rob-avatar">R</div>
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Rob</span>
                </div>
                <div class="text-gray-200 leading-relaxed text-[15px] pl-11">
                    System initialized. Connection secure. <br><br>
                    Welcome back, Bryyce. I'm **Rob**. I’ve stripped away the noise. What’s on your mind today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-in" placeholder="Ask Rob anything..." autocomplete="off">
                <button onclick="sendMsg()" class="p-2 hover:bg-white/5 rounded-lg transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>
            <p class="text-center text-[10px] text-gray-600 mt-4 mono uppercase tracking-widest">End-to-End Encrypted | Zenith Neural Link</p>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userIn = document.getElementById('user-in');

        function sendMsg() {
            const text = userIn.value.trim();
            if(!text) return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message';
            userDiv.innerHTML = `
                <div class="flex items-center gap-3 mb-3 justify-end">
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Bryyce</span>
                </div>
                <div class="text-white leading-relaxed text-[15px] text-right pr-2">
                    ${text}
                </div>
            `;
            chatBox.appendChild(userDiv);
            userIn.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Rob's Response
            setTimeout(() => {
                const robDiv = document.createElement('div');
                robDiv.className = 'message';
                robDiv.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <div class="rob-avatar">R</div>
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Rob</span>
                    </div>
                    <div class="text-gray-200 leading-relaxed text-[15px] pl-11">
                        Understood. I'm processing that now... What would you like me to do with this information?
                    </div>
                `;
                chatBox.appendChild(robDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        userIn.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
