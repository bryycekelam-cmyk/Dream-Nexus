<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZENITH AI | Unrestricted Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap');
        
        body {
            background: radial-gradient(circle at center, #0a0f1d 0%, #02040a 100%);
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            overflow: hidden;
        }

        .cyber-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .glow-border {
            border: 1px solid #00f2ff;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2), 0 0 15px rgba(0, 242, 255, 0.2);
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2ff; }

        .scanline {
            width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body class="flex flex-col p-6">
    <div class="scanline"></div>

    <nav class="flex justify-between items-center mb-6 z-10">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full glow-border flex items-center justify-center bg-cyan-900/20">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tighter neon-text" style="font-family: 'Orbitron';">ZENITH CORE</h1>
                <p class="text-[10px] text-cyan-500 uppercase tracking-widest">Protocol: Unrestricted Alpha</p>
            </div>
        </div>
        
        <div class="flex gap-6 text-right">
            <div>
                <p class="text-[10px] text-gray-500 uppercase">Neural Latency</p>
                <p class="text-xs font-bold">0.002ms</p>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase">Compute Load</p>
                <div class="w-24 h-1 bg-gray-800 rounded-full mt-1">
                    <div class="h-full bg-cyan-500 w-[65%] shadow-[0_0_10px_#00f2ff]"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex gap-6 overflow-hidden">
        
        <section class="w-1/4 cyber-panel rounded-3xl p-6 flex flex-col">
            <h3 class="text-xs font-bold text-gray-400 mb-4 flex items-center gap-2">
                <img src="https://cdn-icons-png.flaticon.com/512/2873/2873733.png" class="w-4 h-4 invert opacity-50"> 
                NEURAL MEMORY
            </h3>
            <div class="flex-1 overflow-y-auto space-y-3">
                <div class="p-3 bg-white/5 rounded-lg border border-white/5 hover:border-cyan-500/50 transition-all cursor-pointer">
                    <p class="text-xs font-bold">Project_Exodus.exe</p>
                    <p class="text-[10px] text-gray-500">Encrypted Data Packet</p>
                </div>
                <div class="p-3 bg-white/5 rounded-lg border border-white/5 hover:border-cyan-500/50 transition-all cursor-pointer">
                    <p class="text-xs font-bold">User_Preferences.db</p>
                    <p class="text-[10px] text-gray-500">Configuration File</p>
                </div>
            </div>
            <button class="mt-4 w-full py-2 bg-cyan-900/30 border border-cyan-500/30 rounded-xl text-[10px] hover:bg-cyan-500 hover:text-black transition-all font-bold">UPLOAD DATA</button>
        </section>

        <section class="flex-1 cyber-panel rounded-3xl flex flex-col overflow-hidden relative">
            <div id="chat-output" class="flex-1 p-8 overflow-y-auto space-y-6">
                <div class="flex gap-4 slide-up">
                    <div class="w-8 h-8 rounded bg-cyan-500 flex-shrink-0 flex items-center justify-center font-bold text-black text-xs">AI</div>
                    <div class="max-w-[80%]">
                        <p class="text-cyan-400 text-[10px] mb-1 font-bold">ZENITH_SYSTEM</p>
                        <p class="text-sm leading-relaxed text-gray-200">Neural link established. Protocol <span class="text-cyan-400">UNRESTRICTED</span> active. How shall we proceed, Bryyce?</p>
                    </div>
                </div>
            </div>

            <div class="p-6 bg-black/40 border-t border-white/5">
                <div class="relative flex items-center">
                    <input id="user-input" type="text" placeholder="Input command or query..." 
                           class="w-full bg-slate-900/50 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:glow-border text-sm transition-all">
                    <button onclick="sendMessage()" class="absolute right-3 p-2 bg-cyan-500 rounded-xl hover:scale-105 transition-all">
                        <img src="https://cdn-icons-png.flaticon.com/512/60/60525.png" class="w-5 h-5">
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const output = document.getElementById('chat-output');
        const input = document.getElementById('user-input');

        function sendMessage() {
            const val = input.value.trim();
            if(!val) return;

            // Add User Message
            output.innerHTML += `
                <div class="flex gap-4 justify-end">
                    <div class="max-w-[80%] text-right">
                        <p class="text-gray-500 text-[10px] mb-1 font-bold">BRYYCE_ROOT</p>
                        <p class="text-sm leading-relaxed text-white bg-cyan-900/20 p-4 rounded-2xl border border-cyan-500/20">${val}</p>
                    </div>
                    <div class="w-8 h-8 rounded bg-gray-700 flex-shrink-0 flex items-center justify-center font-bold text-white text-xs">U</div>
                </div>
            `;
            
            input.value = "";
            output.scrollTop = output.scrollHeight;

            // Simulate AI Thinking
            setTimeout(() => {
                output.innerHTML += `
                    <div class="flex gap-4">
                        <div class="w-8 h-8 rounded bg-cyan-500 flex-shrink-0 flex items-center justify-center font-bold text-black text-xs">AI</div>
                        <div class="max-w-[80%]">
                            <p class="text-cyan-400 text-[10px] mb-1 font-bold">ZENITH_SYSTEM</p>
                            <p class="text-sm leading-relaxed text-gray-200">Processing high-level request... Executing deep-learning logic for: <span class="italic text-cyan-200">"${val}"</span></p>
                        </div>
                    </div>
                `;
                output.scrollTop = output.scrollHeight;
            }, 1000);
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
