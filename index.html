<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROB | Neural Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { background-color: #050505; color: #e2e8f0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background-color: #080808; border-right: 1px solid #151515; display: flex; flex-direction: column; padding: 24px; }
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #050505; }
        .chat-container { flex: 1; overflow-y: auto; padding: 40px 15%; scroll-behavior: smooth; }
        .input-area { padding: 24px 15% 40px 15%; background: linear-gradient(transparent, #050505 40%); }
        .input-wrapper { background: #0f0f0f; border: 1px solid #222; border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; }
        input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 15px; }
        .message { margin-bottom: 32px; animation: fadeIn 0.3s ease-out; }
        .rob-avatar { width: 32px; height: 32px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 14px; }
        .typing-dot { width: 4px; height: 4px; background: #555; border-radius: 50%; animation: blink 1.4s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="flex items-center gap-3 mb-10">
            <div class="rob-avatar">R</div>
            <div>
                <h1 class="font-bold tracking-tight text-lg">ROB</h1>
                <p class="text-[10px] text-cyan-500 mono uppercase tracking-widest">Active Link</p>
            </div>
        </div>
        <div class="space-y-4">
            <div class="text-[10px] text-gray-600 mono uppercase tracking-widest px-2">Knowledge Base</div>
            <div class="p-3 bg-white/5 rounded-lg border border-white/10 text-xs text-gray-300">Personal Insights</div>
            <div class="p-3 hover:bg-white/5 rounded-lg text-xs text-gray-500 cursor-pointer">Strategy Archive</div>
        </div>
        <div class="mt-auto pt-6 border-t border-white/5">
            <p class="text-[10px] text-gray-600 mono uppercase mb-1">Authenticated</p>
            <p class="text-xs font-bold text-white tracking-widest uppercase">Bryyce</p>
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-container" id="chat-box">
            <div class="message">
                <div class="flex items-center gap-3 mb-3">
                    <div class="rob-avatar">R</div>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Rob</span>
                </div>
                <div class="text-gray-200 leading-relaxed text-[15px] pl-11">
                    Bryyce. I'm online. My database is fully synced and ready for your personal queries. Ask me anything.
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-in" placeholder="Message Rob..." autocomplete="off">
                <button onclick="processInput()" class="ml-2 text-gray-500 hover:text-white transition-colors">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userIn = document.getElementById('user-in');

        // This function handles the "Rob" Logic
        async function processInput() {
            const query = userIn.value.trim();
            if(!query) return;

            // 1. Add User Bubble
            addMessage('Bryyce', query, 'user');
            userIn.value = '';

            // 2. Add Typing Indicator
            const typingId = addTypingIndicator();
            
            // 3. Simulate "Rob" Thinking and Responding
            setTimeout(() => {
                removeTypingIndicator(typingId);
                const response = getRobResponse(query);
                addMessage('Rob', response, 'rob');
            }, 1200);
        }

        function getRobResponse(input) {
            const lower = input.toLowerCase();
            
            // Simulated Intelligence Logic
            if(lower.includes("hello") || lower.includes("hi")) return "I'm here, Bryyce. Ready to dive into whatever you need.";
            if(lower.includes("who are you")) return "I am Rob. Your personal intelligence, built on a high-tier database for strategic and personal analysis.";
            if(lower.includes("thank")) return "Always at your service, Bryyce.";
            
            // Default "Deep Thought" response
            return `I've analyzed your request regarding "${input}". To give you the best personal advice, should we look at this from a strategic perspective or a long-term personal growth angle?`;
        }

        function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = 'message';
            const isUser = type === 'user';
            
            div.innerHTML = `
                <div class="flex items-center gap-3 mb-3 ${isUser ? 'justify-end' : ''}">
                    ${!isUser ? '<div class="rob-avatar">R</div>' : ''}
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">${sender}</span>
                </div>
                <div class="text-gray-200 leading-relaxed text-[15px] ${isUser ? 'text-right pr-2' : 'pl-11'}">
                    ${text}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message flex items-center gap-2 pl-11';
            div.innerHTML = `<div class="typing-dot"></div><div class="typing-dot" style="animation-delay:0.2s"></div><div class="typing-dot" style="animation-delay:0.4s"></div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }

        userIn.addEventListener('keypress', (e) => { if(e.key === 'Enter') processInput(); });
    </script>
</body>
</html>
