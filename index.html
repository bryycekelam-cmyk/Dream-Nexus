<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Nexus | Neural AI Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050508; color: #e2e8f0; }
        .glass { background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 0 20px rgba(99, 102, 241, 0.1); }
        .code-font { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_50%_50%,rgba(17,24,39,1),rgba(5,5,8,1))]"></div>

    <div class="w-full max-w-6xl space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/40 p-6 rounded-3xl border border-white/5">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="brain-circuit" class="text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tighter uppercase">Dream <span class="text-indigo-500">Nexus</span></h1>
                    <p class="text-[10px] text-indigo-400 font-bold tracking-[0.2em] uppercase">AI Interface Active</p>
                </div>
            </div>
            <div class="mt-4 md:mt-0 px-6 py-2 bg-slate-950 rounded-2xl border border-white/10 text-center">
                <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Nexus Link Key</span>
                <div id="sessionKeyDisplay" class="text-xl font-black text-white tracking-widest">CONNECTING...</div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- AI Input -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass neon-border rounded-[2.5rem] p-8">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2 mb-4">
                        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400"></i> Neural Prompt
                    </label>
                    <textarea 
                        id="aiPrompt"
                        placeholder="What should I build in Roblox today?" 
                        class="w-full h-48 bg-transparent text-lg text-white placeholder-slate-700 focus:outline-none resize-none leading-relaxed"
                    ></textarea>
                    <button 
                        onclick="generateDream()"
                        id="manifestBtn"
                        class="w-full mt-4 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl text-white font-bold flex items-center justify-center gap-3 transition-all active:scale-95"
                    >
                        <span>Manifest Script</span>
                        <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                    </button>
                </div>

                <div class="glass rounded-[2rem] p-6">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="activity" class="w-3 h-3 text-indigo-500"></i> Connection Logs
                    </h3>
                    <div id="activityFeed" class="space-y-2 h-32 overflow-y-auto pr-2 custom-scrollbar text-[11px]">
                        <p class="text-slate-600 italic">Standby for input...</p>
                    </div>
                </div>
            </div>

            <!-- AI Output (The "Inspect" Alternative) -->
            <div class="lg:col-span-7">
                <div class="bg-slate-950 rounded-[2.5rem] border border-white/10 flex flex-col h-full overflow-hidden min-h-[500px]">
                    <div class="bg-slate-900 px-6 py-4 border-b border-white/5 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Synthesized Luau Code</span>
                        <button onclick="copyCode()" class="text-[10px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded-lg transition-colors flex items-center gap-2">
                            <i data-lucide="copy" class="w-3 h-3"></i> Copy
                        </button>
                    </div>
                    <div class="p-6 flex-grow overflow-auto custom-scrollbar">
                        <pre id="outputCode" class="code-font text-emerald-400 text-sm whitespace-pre-wrap">-- Waiting for prompt synthesis...</pre>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center z-50">
        <div class="w-16 h-16 border-t-2 border-indigo-500 rounded-full animate-spin mb-4"></div>
        <p class="text-indigo-400 font-bold text-xs tracking-widest uppercase">Thinking...</p>
    </div>

    <script>
        lucide.createIcons();
        const apiKey = ""; 
        const sessionKey = Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById('sessionKeyDisplay').innerText = sessionKey;

        function addLog(msg, color = "text-slate-400") {
            const feed = document.getElementById('activityFeed');
            const item = document.createElement('p');
            item.className = color;
            item.innerText = `> ${msg}`;
            feed.prepend(item);
        }

        async function generateDream() {
            const prompt = document.getElementById('aiPrompt').value;
            if(!prompt) return;

            const loader = document.getElementById('loader');
            const output = document.getElementById('outputCode');
            
            loader.classList.remove('hidden');
            addLog("Contacting AI engine...", "text-indigo-400");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Write a Roblox Luau script for: ${prompt}. Return ONLY the code, no talk.` }] }]
                    })
                });

                const data = await response.json();
                const code = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error generating code.";
                
                output.innerText = code.replace(/```lua|```/g, "");
                addLog("Neural link successful.", "text-emerald-400");
            } catch (err) {
                addLog("Neural link failed.", "text-red-400");
                output.innerText = "-- Error connecting to AI. Check your API key.";
            } finally {
                loader.classList.add('hidden');
            }
        }

        function copyCode() {
            const code = document.getElementById('outputCode').innerText;
            const el = document.createElement('textarea');
            el.value = code;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            addLog("Code copied to clipboard!", "text-white");
        }
    </script>
</body>
</html>
