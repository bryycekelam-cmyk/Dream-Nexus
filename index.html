<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign Bryyce: Titan Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@300;500;700&display=swap');
        
        :root {
            --gold: #ffd700;
            --royal-blue: #1e40af;
            --ui-bg: rgba(13, 17, 23, 0.95);
        }

        body, html { margin: 0; padding: 0; background: #02040a; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; height: 100%; width: 100%; }
        .royal { font-family: 'Cinzel', serif; }

        /* ADVANCED MAP LAYER */
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        #world-map { 
            width: 4000px; height: 4000px; 
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png'), #0f172a;
            background-size: auto, 100px 100px;
            position: absolute; will-change: transform;
        }

        /* TITAN ASSETS */
        .castle-player { 
            width: 120px; height: 120px; 
            background: url('https://cdn-icons-png.flaticon.com/512/10044/10044823.png') center/contain no-repeat;
            filter: drop-shadow(0 0 15px var(--royal-blue));
        }

        .zenith-tower { 
            width: 200px; height: 200px; 
            background: url('https://cdn-icons-png.flaticon.com/512/3530/3530084.png') center/contain no-repeat;
            filter: drop-shadow(0 0 25px var(--gold));
        }

        /* BACKPACK GRID */
        .backpack-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .item-slot {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .item-slot:hover { border-color: var(--gold); transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .item-slot img { width: 60px; height: 60px; margin: 0 auto 8px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }

        /* UI ANIMATIONS */
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .shield-glow { box-shadow: 0 0 50px #00f2ff !important; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="world-map" style="transform: translate(-1850px, -1850px);">
            <div class="absolute" style="top: 2000px; left: 2000px; transform: translate(-50%, -50%);" onclick="alert('The Imperial Zenith is locked.')">
                <div class="zenith-tower"></div>
                <div class="bg-black/80 text-gold font-bold text-center px-4 py-1 border border-yellow-500 rounded mt-2">ZENITH [0,0]</div>
            </div>

            <div id="player-castle" class="absolute" style="top: 2200px; left: 2200px; transform: translate(-50%, -50%);">
                <div class="castle-player"></div>
                <div class="bg-blue-900/90 text-white text-center px-4 py-1 border border-blue-400 rounded mt-2">BRYYCE [SKY]</div>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none z-50">
        <div class="p-4 flex justify-between items-start pointer-events-auto">
            <div class="flex gap-4 items-center bg-black/60 p-2 rounded-full border border-white/10">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bryyce" class="w-12 h-12 rounded-full border-2 border-yellow-500">
                <div>
                    <h2 class="royal text-yellow-500 leading-tight">BRYYCE</h2>
                    <p class="text-xs font-bold text-white">MIGHT: <span class="text-green-400">185.2M</span></p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <div class="bg-gray-900/90 px-4 py-1 rounded border border-cyan-500 flex items-center gap-2">
                    <img src="https://cdn-icons-png.flaticon.com/512/1065/1065500.png" class="w-4 invert">
                    <span class="text-cyan-400 font-bold">520,000</span>
                </div>
                <button onclick="toggleUI('backpack')" class="bg-blue-600 p-2 rounded border border-blue-400">
                    <img src="https://cdn-icons-png.flaticon.com/512/2873/2873733.png" class="w-6 invert">
                </button>
            </div>
        </div>

        <div class="absolute bottom-6 left-6 right-6 flex justify-between items-end pointer-events-auto">
            <div class="bg-black/80 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] text-gray-500 uppercase font-bold">World Coordinates</p>
                <div class="flex gap-3 items-center">
                    <span class="text-yellow-500 font-mono text-xl" id="coord-display">X: 2200 Y: 2200</span>
                    <button onclick="recallCamera()" class="bg-white/10 p-2 rounded hover:bg-white/20">🏠</button>
                </div>
            </div>
            
            <div class="flex flex-col gap-2">
                <button onclick="toggleShield()" id="shield-btn" class="bg-emerald-600 px-6 py-3 rounded-full font-bold shadow-lg">ACTIVATE SHIELD</button>
                <button onclick="toggleUI('mall')" class="bg-gradient-to-r from-purple-600 to-indigo-600 px-6 py-3 rounded-full font-bold shadow-lg">IMPERIAL MALL</button>
            </div>
        </div>
    </div>

    <div id="ui-backpack" class="fixed inset-0 bg-black/90 z-[100] hidden items-center justify-center p-6">
        <div class="bg-slate-900 w-full max-w-4xl rounded-3xl border-2 border-slate-700 slide-up overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                <h2 class="royal text-3xl text-white">IMPERIAL INVENTORY</h2>
                <button onclick="toggleUI('backpack')" class="text-3xl text-slate-400">&times;</button>
            </div>
            <div class="backpack-grid max-h-[60vh] overflow-y-auto" id="inventory-list">
                </div>
        </div>
    </div>

    <script>
        // Item Database
        const items = [
            { name: "8h Shield", img: "https://cdn-icons-png.flaticon.com/512/2907/2907044.png", qty: 12, rarity: "epic" },
            { name: "24h Speed", img: "https://cdn-icons-png.flaticon.com/512/9639/9639088.png", qty: 45, rarity: "rare" },
            { name: "Warp Scroll", img: "https://cdn-icons-png.flaticon.com/512/6120/6120306.png", qty: 8, rarity: "legendary" },
            { name: "Gold Crate", img: "https://cdn-icons-png.flaticon.com/512/3238/3238699.png", qty: 150, rarity: "common" },
            { name: "T4 Contract", img: "https://cdn-icons-png.flaticon.com/512/2907/2907572.png", qty: 2, rarity: "legendary" }
        ];

        function initInventory() {
            const grid = document.getElementById('inventory-list');
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="item-slot">
                        <img src="${item.img}" alt="${item.name}">
                        <p class="text-xs font-bold text-white">${item.name}</p>
                        <p class="text-[10px] text-yellow-500">QTY: ${item.qty}</p>
                    </div>
                `;
            });
        }

        // Camera & Map Logic
        let scrollX = -1850, scrollY = -1850;
        let isDragging = false, startX, startY;
        const map = document.getElementById('world-map');

        window.addEventListener('mousedown', (e) => {
            if(e.target.closest('.pointer-events-auto')) return;
            isDragging = true;
            startX = e.clientX - scrollX;
            startY = e.clientY - scrollY;
        });

        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            scrollX = e.clientX - startX;
            scrollY = e.clientY - startY;
            map.style.transform = `translate(${scrollX}px, ${scrollY}px)`;
            
            const worldX = Math.round(Math.abs(scrollX) + (window.innerWidth/2));
            const worldY = Math.round(Math.abs(scrollY) + (window.innerHeight/2));
            document.getElementById('coord-display').innerText = `X: ${worldX} Y: ${worldY}`;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        function toggleUI(id) {
            const el = document.getElementById(`ui-${id}`);
            el.classList.toggle('hidden');
            el.classList.toggle('flex');
        }

        function recallCamera() {
            scrollX = -2200 + (window.innerWidth/2);
            scrollY = -2200 + (window.innerHeight/2);
            map.style.transition = "transform 0.5s ease-out";
            map.style.transform = `translate(${scrollX}px, ${scrollY}px)`;
            setTimeout(() => map.style.transition = "none", 500);
        }

        function toggleShield() {
            const castle = document.getElementById('player-castle');
            const btn = document.getElementById('shield-btn');
            castle.classList.toggle('shield-glow');
            const isActive = castle.classList.contains('shield-glow');
            btn.innerText = isActive ? "SHIELD ACTIVE" : "ACTIVATE SHIELD";
            btn.className = isActive ? "bg-blue-500 px-6 py-3 rounded-full font-bold" : "bg-emerald-600 px-6 py-3 rounded-full font-bold";
        }

        initInventory();
    </script>
</body>
</html>
