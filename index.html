<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tap Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; transition: background 0.5s ease; }
        
        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stats-panel { position: absolute; top: 20px; left: 20px; pointer-events: auto; }
        .index-panel { 
            position: absolute; top: 20px; right: 20px; 
            background: rgba(0,0,0,0.6); padding: 15px; 
            border-radius: 10px; border: 2px solid gold;
            pointer-events: auto; max-height: 300px; overflow-y: auto;
        }

        .controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; }

        button {
            pointer-events: auto;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #ffcc00;
            border: none;
            border-radius: 5px;
            margin: 5px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #555; cursor: not-allowed; }

        .pet-item { color: #00ffcc; font-size: 14px; margin-bottom: 5px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="stats-panel">
        <h1 style="font-size: 40px; margin: 0;">Taps: <span id="tapCount">0</span></h1>
        <h2 style="color: #00ffcc;">Rebirths: <span id="rebirthCount">0</span></h2>
        <button onclick="doRebirth()">REBIRTH (Cost: <span id="rebirthCost">1000</span>)</button>
        <button onclick="hatchEgg()" id="hatchBtn">HATCH EGG (500 Taps)</button>
    </div>

    <div class="index-panel">
        <h3 style="margin-top: 0; color: gold;">🐾 PET INDEX</h3>
        <div id="petList">No pets yet...</div>
    </div>

    <div class="controls-hint">
        <p><b>WASD</b> to Walk | <b>SPACE</b> to Tap | <b>R</b> to Rebirth</p>
        <p id="biomeText" style="font-weight: bold; font-size: 20px; color: #fff;"></p>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    // --- Configuration & Data ---
    const PET_TYPES = [
        { name: "Common Dog", chance: 0.60, mult: 1.2, color: "#8B4513" },
        { name: "Rare Cat", chance: 0.30, mult: 2.5, color: "#D2B48C" },
        { name: "Epic Dragon", chance: 0.08, mult: 10, color: "#FF4500" },
        { name: "LEGENDARY GLITCH", chance: 0.02, mult: 50, color: "#FF00FF" }
    ];

    const BIOMES = [
        { name: "Grassy Plains", color: "#45a247", req: 0 },
        { name: "Frozen Tundra", color: "#83a4d4", req: 5 },
        { name: "Void Zone", color: "#16222a", req: 15 }
    ];

    let player = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        size: 50,
        speed: 5,
        taps: 0,
        rebirths: 0,
        pets: [],
        color: "#fff"
    };

    let keys = {};

    // --- Core Logic ---
    function init() {
        resize();
        window.addEventListener("keydown", (e) => { 
            keys[e.key.toLowerCase()] = true; 
            if(e.code === "Space") tap();
            if(e.key === "r") doRebirth();
        });
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener("resize", resize);
        update();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function tap() {
        let petBonus = player.pets.reduce((acc, pet) => acc + pet.mult, 1);
        player.taps += (1 + player.rebirths) * petBonus;
        updateUI();
    }

    function doRebirth() {
        let cost = (player.rebirths + 1) * 1000;
        if (player.taps >= cost) {
            player.taps = 0;
            player.rebirths++;
            updateUI();
        }
    }

    function hatchEgg() {
        if (player.taps >= 500) {
            player.taps -= 500;
            let rand = Math.random();
            let cumulativeChance = 0;
            let selectedPet = PET_TYPES[0];

            for (let pet of PET_TYPES) {
                cumulativeChance += pet.chance;
                if (rand <= cumulativeChance) {
                    selectedPet = pet;
                    break;
                }
            }
            
            player.pets.push({...selectedPet});
            updatePetIndex();
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById("tapCount").innerText = Math.floor(player.taps);
        document.getElementById("rebirthCount").innerText = player.rebirths;
        document.getElementById("rebirthCost").innerText = (player.rebirths + 1) * 1000;
        document.getElementById("hatchBtn").disabled = player.taps < 500;
    }

    function updatePetIndex() {
        const list = document.getElementById("petList");
        list.innerHTML = player.pets.map(p => `<div class="pet-item">${p.name} (x${p.mult})</div>`).join("");
    }

    // --- Game Loop ---
    function update() {
        // Movement
        if (keys['w']) player.y -= player.speed;
        if (keys['s']) player.y += player.speed;
        if (keys['a']) player.x -= player.speed;
        if (keys['d']) player.x += player.speed;

        // Determine Biome
        let currentBiome = BIOMES[0];
        BIOMES.forEach(b => { if (player.rebirths >= b.req) currentBiome = b; });
        canvas.style.backgroundColor = currentBiome.color;
        document.getElementById("biomeText").innerText = "Biome: " + currentBiome.name;

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player "Rig" (Square for now, custom skin-able)
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.fillRect(player.x, player.y, player.size, player.size);
        
        // Draw Pets following player
        player.pets.forEach((pet, i) => {
            let time = Date.now() / 500;
            let spacing = (i + 1) * 40;
            let px = player.x + Math.cos(time + i) * spacing;
            let py = player.y + Math.sin(time + i) * spacing;
            
            ctx.fillStyle = pet.color;
            ctx.beginPath();
            ctx.arc(px + 25, py + 25, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.stroke();
        });
    }

    init();
</script>

</body>
</html>
