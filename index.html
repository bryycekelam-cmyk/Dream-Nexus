<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Bryyce: Guilds & Glory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Oswald:wght@500;700&display=swap');
        
        body, html { margin: 0; padding: 0; background: #05070a; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; }
        .royal { font-family: 'Cinzel', serif; }

        /* THE CITY MAP */
        #city-map {
            width: 100vw; height: 100vh;
            background: url('https://i.imgur.com/8T8C9po.jpeg') center no-repeat;
            background-size: cover; position: relative;
        }

        /* WORLD CHAT OVERLAY */
        #world-chat {
            position: fixed; bottom: 100px; left: 20px; width: 380px; height: 200px;
            background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; z-index: 500;
        }
        .chat-msg { padding: 4px 10px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* INTERACTIVE ASSETS */
        .building { position: absolute; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .building:hover { transform: scale(1.1); filter: brightness(1.2); }
        .label { background: rgba(0,0,0,0.9); border: 1px solid #ffd700; padding: 2px 8px; border-radius: 4px; font-size: 10px; color: #ffd700; margin-top: -10px; }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; display: none; padding: 40px; }
        .active-ui { display: flex !important; flex-direction: column; }

        /* LEADERBOARD TABLE */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #666; font-size: 12px; border-bottom: 1px solid #333; padding: 10px; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; }
        .rank-1 { color: #ffd700; font-weight: 900; }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full z-[1000] p-4 flex justify-between bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-4 bg-black/60 p-2 rounded-xl border border-white/10">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=BryyceTitan" class="w-14 h-14 rounded-lg border-2 border-yellow-500">
            <div>
                <p class="royal text-white text-lg leading-none">LORD BRYYCE</p>
                <p class="text-yellow-500 text-xs font-black">GUILD: <span class="text-white">[SKY] Skyborn</span></p>
                <p class="text-[10px] text-cyan-400">MIGHT: <span id="might-val">185.2M</span></p>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="openUI('leaderboard')" class="bg-zinc-800 px-4 py-2 rounded-lg border border-white/20 hover:bg-zinc-700 transition">🏆 RANKINGS</button>
            <div class="bg-black/90 px-6 py-2 rounded-lg border-b-2 border-cyan-500 text-cyan-400 font-bold">💎 <span id="gem-val">520,000</span></div>
        </div>
    </div>

    <div id="world-chat">
        <div class="bg-zinc-900 px-3 py-1 text-[10px] font-bold text-gray-500 uppercase tracking-widest">Kingdom Chat #442</div>
        <div id="chat-content" class="flex-1 overflow-y-auto p-2"></div>
        <div class="p-2 bg-black/50 border-t border-white/10 flex gap-2">
            <input type="text" id="chat-input" placeholder="Type to chat..." class="bg-transparent text-xs w-full outline-none">
            <button onclick="sendMsg()" class="text-yellow-500 text-xs font-bold">SEND</button>
        </div>
    </div>

    <div id="city-map">
        <div class="building w-48 top-[25%] left-[15%]" onclick="openUI('guild')">
            <img src="https://cdn-icons-png.flaticon.com/512/3069/3069512.png">
            <div class="label">GUILD HALL</div>
        </div>
        <div class="building w-64 top-[35%] left-[42%]" onclick="alert('Citadel Secure')">
            <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png">
            <div class="label">LORD'S KEEP</div>
        </div>
        <div class="building w-32 top-[60%] left-[70%]" onclick="alert('Shop Opening...')">
            <img src="https://cdn-icons-png.flaticon.com/512/3593/3593452.png">
            <div class="label text-pink-500">MALL</div>
        </div>
    </div>

    <div id="ui-leaderboard" class="overlay">
        <div class="flex justify-between items-center mb-10">
            <h2 class="royal text-4xl text-yellow-500">GLOBAL RANKINGS</h2>
            <button onclick="closeUI('leaderboard')" class="text-5xl">&times;</button>
        </div>
        <div class="flex gap-4 mb-6">
            <button class="bg-yellow-600 text-black px-6 py-2 rounded font-bold">PLAYER MIGHT</button>
            <button class="bg-zinc-800 px-6 py-2 rounded font-bold">GUILD MIGHT</button>
        </div>
        <div class="overflow-y-auto flex-1">
            <table>
                <thead>
                    <tr><th>RANK</th><th>PLAYER</th><th>GUILD</th><th>MIGHT</th></tr>
                </thead>
                <tbody id="leader-table">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="ui-guild" class="overlay">
        <div class="flex justify-between items-center mb-10">
            <h2 class="royal text-4xl text-blue-400">GUILD MANAGEMENT</h2>
            <button onclick="closeUI('guild')" class="text-5xl">&times;</button>
        </div>
        <div class="grid grid-cols-2 gap-10">
            <div class="bg-zinc-900 p-8 rounded-2xl border border-blue-500/30">
                <h3 class="text-2xl font-bold mb-4">[SKY] Skyborn</h3>
                <p class="text-gray-400 mb-6 italic">"To the heavens and beyond! We rule the sky."</p>
                <div class="space-y-2">
                    <p class="flex justify-between"><span>Leader:</span> <span class="text-yellow-500 font-bold">Bryyce</span></p>
                    <p class="flex justify-between"><span>Members:</span> <span>98/100</span></p>
                    <p class="flex justify-between"><span>Gift Level:</span> <span class="text-green-400">25</span></p>
                </div>
            </div>
            <div class="bg-zinc-900 p-8 rounded-2xl border border-white/5">
                <h3 class="text-xl font-bold mb-4">GUILD ACTIONS</h3>
                <button class="w-full bg-blue-600 py-3 rounded-lg mb-4 font-bold">SEND GUILD HELP</button>
                <button class="w-full bg-zinc-800 py-3 rounded-lg font-bold">VIEW ALLIANCE MEMBERS</button>
            </div>
        </div>
    </div>

    <script>
        // --- CHAT ENGINE ---
        const aiPlayers = ["VikingLord", "ShadowKing", "QueenRage", "DragonSlayer", "FarmerJoe"];
        const aiMessages = ["Rally on the Wonder!", "Any guilds recruiting?", "Just hit 200M Might!", "Trading wood for gold.", "Help me with research!"];
        
        function addChat(user, msg, color = "white") {
            const chat = document.getElementById('chat-content');
            const div = document.createElement('div');
            div.className = "chat-msg";
            div.innerHTML = `<span class="text-yellow-500 font-bold">[K442] ${user}:</span> <span style="color:${color}">${msg}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        setInterval(() => {
            const p = aiPlayers[Math.floor(Math.random() * aiPlayers.length)];
            const m = aiMessages[Math.floor(Math.random() * aiMessages.messages?.length || 5)];
            addChat(p, m);
        }, 4000);

        function sendMsg() {
            const input = document.getElementById('chat-input');
            if(input.value) { addChat("Bryyce", input.value, "#00ffcc"); input.value = ""; }
        }

        // --- LEADERBOARD ENGINE ---
        const leaders = [
            { rank: 1, name: "Bryyce", guild: "SKY", might: "185.2M" },
            { rank: 2, name: "GodZilla", guild: "REX", might: "172.1M" },
            { rank: 3, name: "X-Man", guild: "SKY", might: "165.9M" },
            { rank: 4, name: "TheGhost", guild: "VOID", might: "140.2M" },
            { rank: 5, name: "Lulu77", guild: "MEOW", might: "138.0M" }
        ];

        function loadLeaders() {
            const table = document.getElementById('leader-table');
            leaders.forEach(l => {
                table.innerHTML += `<tr><td class="${l.rank==1?'rank-1':''}">${l.rank}</td><td>${l.name}</td><td>[${l.guild}]</td><td>${l.might}</td></tr>`;
            });
        }

        function openUI(id) { document.getElementById('ui-' + id).classList.add('active-ui'); }
        function closeUI(id) { document.getElementById('ui-' + id).classList.remove('active-ui'); }

        window.onload = loadLeaders;
    </script>
</body>
</html>
