<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Empire: Age of Bryyce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Oswald:wght@500&display=swap');
        
        body { background: #000; overflow: hidden; font-family: 'Oswald', sans-serif; }
        
        /* ISOMETRIC GRID TRANSFORMATION */
        #world-map {
            display: grid;
            grid-template-columns: repeat(20, 120px);
            grid-template-rows: repeat(20, 120px);
            transform: rotateX(60deg) rotateZ(45deg);
            transform-style: preserve-3d;
            transition: all 0.5s ease-out;
        }

        .tile {
            width: 120px;
            height: 120px;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png'), #2d4d2d;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* 3D BUILDINGS */
        .building {
            transform: rotateZ(-45deg) rotateX(-60deg) translateY(-40px);
            filter: drop-shadow(0 20px 10px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }
        .building:hover { transform: rotateZ(-45deg) rotateX(-60deg) translateY(-50px) scale(1.1); }

        .hud-gradient { background: linear-gradient(to bottom, #3e2b1c 0%, #1a1108 100%); border-bottom: 3px solid #ffd700; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="text-white select-none">

    <div class="hud-gradient h-28 w-full fixed top-0 z-50 flex items-center justify-between px-8 shadow-2xl">
        <div class="flex items-center gap-5">
            <div class="relative">
                <div class="w-20 h-20 rounded-xl border-4 border-[#ffd700] overflow-hidden bg-slate-900 shadow-[0_0_20px_rgba(255,215,0,0.3)]">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=King" class="w-full h-full">
                </div>
                <div class="absolute -bottom-2 -right-2 bg-red-600 px-2 py-1 rounded font-bold text-xs border border-white">LV 50</div>
            </div>
            <div>
                <h1 style="font-family: 'Cinzel';" class="text-[#ffd700] text-3xl italic tracking-tighter">LORD BRYYCE</h1>
                <div class="flex items-center gap-3 mt-1">
                    <span class="text-xs text-gray-400 font-bold uppercase tracking-widest">Power: 12,450,000</span>
                    <div class="w-48 h-3 bg-black/50 rounded-full border border-yellow-900 overflow-hidden">
                        <div class="bg-gradient-to-r from-orange-500 to-yellow-400 h-full w-3/4 shadow-[0_0_10px_orange]"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-4">
            <div class="bg-black/60 rounded-lg p-2 border-2 border-[#ffd700]/30 flex items-center gap-3 w-32">
                <img src="https://cdn-icons-png.flaticon.com/512/209/209931.png" class="w-6 h-6">
                <span class="text-cyan-400 font-black text-xl">45K</span>
            </div>
            <div class="bg-black/60 rounded-lg p-2 border-2 border-green-500/30 flex items-center gap-3 w-32">
                <img src="https://cdn-icons-png.flaticon.com/512/3133/3133463.png" class="w-6 h-6">
                <span class="text-green-400 font-black text-xl">1.2M</span>
            </div>
            <button class="bg-[#ffd700] text-black px-6 py-2 rounded-lg font-black hover:bg-white transition uppercase shadow-lg">Store</button>
        </div>
    </div>

    <div id="camera" class="w-full h-screen flex items-center justify-center cursor-move">
        <div id="world-map">
            </div>
    </div>

    <div class="fixed bottom-0 w-full h-24 bg-gradient-to-t from-black to-transparent flex justify-center gap-10 items-end pb-6 px-10">
        <button onclick="zoomMap(0.8)" class="bg-slate-800 p-4 rounded-full border-2 border-white/20 hover:border-yellow-500 transition shadow-xl">
            <span class="text-2xl">🔍</span>
        </button>
        <div class="bg-black/80 h-16 px-10 rounded-t-3xl border-x-2 border-t-2 border-[#ffd700] flex items-center gap-12">
            <div class="flex flex-col items-center cursor-pointer group">
                <span class="text-3xl group-hover:scale-125 transition">🏰</span>
                <span class="text-[10px] text-yellow-500 font-bold uppercase">City</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer group opacity-50">
                <span class="text-3xl group-hover:scale-125 transition">🛡️</span>
                <span class="text-[10px] text-yellow-500 font-bold uppercase">Heroes</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer group opacity-50">
                <span class="text-3xl group-hover:scale-125 transition">⚔️</span>
                <span class="text-[10px] text-yellow-500 font-bold uppercase">Battle</span>
            </div>
        </div>
        <button onclick="zoomMap(1.2)" class="bg-slate-800 p-4 rounded-full border-2 border-white/20 hover:border-yellow-500 transition shadow-xl">
            <span class="text-2xl">🔎</span>
        </button>
    </div>

    <script>
        const map = document.getElementById('world-map');
        let currentZoom = 1;

        function initMap() {
            map.innerHTML = '';
            for (let i = 0; i < 400; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                
                // Add high-def buildings to certain spots
                if (i === 210) { // Player Main Castle
                    tile.innerHTML = `
                        <div class="building floating z-50">
                            <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-32 h-32">
                            <div class="bg-yellow-500 text-black font-black px-2 py-0.5 rounded-full absolute -top-5 left-1/2 -translate-x-1/2 text-xs border-2 border-black">YOUR CASTLE</div>
                        </div>`;
                } else if (i % 45 === 0 && i !== 0) { // Resource Nodes
                    tile.innerHTML = `
                        <div class="building opacity-90">
                            <img src="https://cdn-icons-png.flaticon.com/512/3133/3133463.png" class="w-16 h-16">
                        </div>`;
                } else if (i % 67 === 0) { // Enemy Dark Nests
                    tile.innerHTML = `
                        <div class="building">
                            <img src="https://cdn-icons-png.flaticon.com/512/2829/2829816.png" class="w-24 h-24 brightness-50 sepia-[1] saturate-[5]">
                        </div>`;
                }
                
                map.appendChild(tile);
            }
        }

        function zoomMap(factor) {
            currentZoom *= factor;
            map.style.scale = currentZoom;
        }

        // Draggable Map Logic
        let isDown = false;
        let startX, startY, scrollLeft, scrollTop;

        window.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX; startY = e.pageY; });
        window.addEventListener('mouseup', () => { isDown = false; });
        window.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            const walkX = (e.pageX - startX) * 2;
            const walkY = (e.pageY - startY) * 2;
            document.getElementById('camera').style.transform = `translate(${walkX}px, ${walkY}px)`;
        });

        initMap();
    </script>
</body>
</html>
