<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Bryyce: Triple Crown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@700&display=swap');
        
        :root {
            --gold: #ffd700;
            --royal-red: #8b0000;
            --throne-purple: #4b0082;
        }

        body { background: #000; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; margin: 0; user-select: none; }
        .royal { font-family: 'Cinzel', serif; }

        /* SCENE MANAGEMENT */
        .scene { position: absolute; inset: 0; transition: opacity 0.8s ease, transform 0.8s ease; }
        .hidden-scene { opacity: 0; pointer-events: none; transform: scale(1.1); }

        /* 3D CASTLE INTERIOR (THRONE ROOM) */
        #throne-room {
            background: linear-gradient(to bottom, #1a0f00 0%, #4b0082 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .pillar {
            width: 60px; height: 100%;
            background: linear-gradient(90deg, #222, #444, #222);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
        .throne {
            filter: drop-shadow(0 0 30px var(--gold));
            animation: throne-glow 3s infinite alternate;
        }
        @keyframes throne-glow { from { filter: drop-shadow(0 0 20px gold); } to { filter: drop-shadow(0 0 60px gold); } }

        /* CITY VIEW (3D CASTLE IMAGE) */
        .castle-container {
            perspective: 1000px;
        }
        .castle-3d {
            transform: rotateX(10deg);
            filter: drop-shadow(0 50px 30px rgba(0,0,0,0.5));
            transition: transform 0.5s;
        }
        .castle-3d:hover { transform: rotateX(20deg) scale(1.05); }

        /* SHOP UI */
        #shop-modal { background: rgba(0,0,0,0.95); backdrop-blur: 20px; }
        .shop-card {
            background: linear-gradient(135deg, #2c1e16 0%, #1a0f00 100%);
            border: 2px solid var(--gold);
            transition: transform 0.2s;
        }
        .shop-card:hover { transform: translateY(-5px); border-color: #fff; }

        /* HEADERS */
        .slanted-tab {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            background: rgba(0,0,0,0.8);
            border-left: 3px solid var(--gold);
        }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full z-[1000] p-4 flex justify-between items-start pointer-events-none">
        <div class="flex items-center gap-4 pointer-events-auto">
            <div class="relative w-20 h-20 border-4 border-white rounded-xl overflow-hidden shadow-2xl bg-slate-900">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bryyce" alt="Lord">
                <div class="absolute bottom-0 bg-blue-600 w-full text-[10px] text-center font-black">VIP 15</div>
            </div>
            <div>
                <h1 class="royal text-xl text-white tracking-widest drop-shadow-md">LORD BRYYCE</h1>
                <div class="bg-gradient-to-r from-yellow-600 to-transparent px-4 py-0.5 mt-1 border-l-4 border-yellow-400">
                    <span class="text-xs font-black">POWER: <span id="pwr-val" class="text-yellow-200">85,200,000</span></span>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="flex gap-2">
                <div class="slanted-tab px-4 py-1 flex items-center gap-2 min-w-[100px]">
                    <span class="text-yellow-400 text-xs">💎</span>
                    <span id="gem-count" class="text-xs font-bold text-cyan-300">150,000</span>
                </div>
                <button onclick="openShop()" class="bg-green-600 px-4 py-1 rounded font-black text-xs border-b-4 border-green-900 active:translate-y-1 transition">SHOP</button>
            </div>
        </div>
    </div>

    <div id="scene-interior" class="scene hidden-scene flex items-center justify-between px-20">
        <div class="pillar"></div>
        <div class="flex flex-col items-center">
            <h2 class="royal text-5xl mb-10 text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 to-yellow-600">THRONE ROOM</h2>
            <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="throne w-80 h-80">
            <button onclick="switchScene('city')" class="mt-10 px-8 py-3 bg-white text-black font-black royal rounded-full hover:bg-yellow-500 transition">EXIT TO TURF</button>
        </div>
        <div class="pillar"></div>
    </div>

    <div id="scene-city" class="scene flex flex-col items-center justify-center bg-[url('https://i.imgur.com/8T8C9po.jpeg')] bg-cover">
        <div class="absolute inset-0 bg-black/40"></div>
        <div class="castle-container z-10 flex flex-col items-center">
            <div class="bg-black/80 px-4 py-1 rounded border border-yellow-500 mb-4 animate-bounce">
                <span class="text-yellow-500 text-xs font-bold">CLICK CASTLE TO ENTER</span>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" 
                 class="castle-3d w-96 h-96 cursor-pointer" 
                 onclick="switchScene('interior')">
            <h1 class="royal text-4xl mt-4 drop-shadow-[0_5px_5px_black]">BRYYCE'S CITADEL</h1>
        </div>
        
        <div class="absolute bottom-10 flex gap-6 z-20">
            <button onclick="switchScene('world')" class="px-10 py-4 bg-yellow-600 rounded-xl font-black text-xl shadow-2xl border-b-4 border-yellow-900 uppercase">Go to World Map</button>
        </div>
    </div>

    <div id="scene-world" class="scene hidden-scene bg-green-900 overflow-hidden">
        <div id="world-map-container" class="relative w-[4000px] h-[4000px] bg-[#1a2e1a]" style="background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');">
            <div id="player-on-map" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-32 h-32">
                <div class="bg-blue-600 px-2 rounded text-[10px] font-bold">MY CITADEL</div>
            </div>
        </div>
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2">
            <button onclick="switchScene('city')" class="px-10 py-4 bg-blue-600 rounded-xl font-black text-xl shadow-2xl border-b-4 border-blue-900 uppercase">Back to City</button>
        </div>
    </div>

    <div id="shop-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center p-10">
        <div class="w-full max-w-4xl bg-[#1a0f00] border-4 border-yellow-600 rounded-3xl overflow-hidden flex flex-col">
            <div class="p-6 bg-yellow-600 text-black flex justify-between items-center">
                <h2 class="royal text-3xl font-black italic">ITEM SHOP</h2>
                <button onclick="closeShop()" class="text-4xl font-black">&times;</button>
            </div>
            <div class="grid grid-cols-3 gap-6 p-10 overflow-y-auto max-h-[600px]">
                <div class="shop-card p-6 rounded-2xl flex flex-col items-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/209/209931.png" class="w-20 h-20 mb-4">
                    <h4 class="font-bold text-xl">10,000 GEMS</h4>
                    <button class="mt-4 w-full bg-yellow-500 text-black py-2 rounded font-black">$9.99</button>
                </div>
                <div class="shop-card p-6 rounded-2xl flex flex-col items-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-20 h-20 mb-4">
                    <h4 class="font-bold text-xl">CASTLE SKIN</h4>
                    <button class="mt-4 w-full bg-yellow-500 text-black py-2 rounded font-black">$49.99</button>
                </div>
                <div class="shop-card p-6 rounded-2xl flex flex-col items-center border-purple-500">
                    <img src="https://cdn-icons-png.flaticon.com/512/2829/2829816.png" class="w-20 h-20 mb-4">
                    <h4 class="font-bold text-xl">WAR PACK</h4>
                    <button class="mt-4 w-full bg-yellow-500 text-black py-2 rounded font-black">$19.99</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentGems = 150000;
        let currentPower = 85200000;

        function switchScene(sceneId) {
            // Hide all
            document.getElementById('scene-interior').classList.add('hidden-scene');
            document.getElementById('scene-city').classList.add('hidden-scene');
            document.getElementById('scene-world').classList.add('hidden-scene');

            // Show target
            document.getElementById('scene-' + sceneId).classList.remove('hidden-scene');
            
            // Add world map nodes if entering world
            if(sceneId === 'world') {
                generateWorldNodes();
            }
        }

        function openShop() { document.getElementById('shop-modal').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shop-modal').classList.add('hidden'); }

        function generateWorldNodes() {
            const container = document.getElementById('world-map-container');
            const icons = [
                'https://cdn-icons-png.flaticon.com/512/616/616490.png',
                'https://cdn-icons-png.flaticon.com/512/2489/2489756.png',
                'https://cdn-icons-png.flaticon.com/512/2829/2829816.png'
            ];
            
            for(let i=0; i<50; i++) {
                const x = 500 + Math.random() * 3000;
                const y = 500 + Math.random() * 3000;
                const img = icons[Math.floor(Math.random()*icons.length)];
                
                const node = document.createElement('img');
                node.src = img;
                node.className = 'absolute w-16 h-16 drop-shadow-xl hover:scale-125 transition cursor-pointer';
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                container.appendChild(node);
            }
        }

        // Initialize world map on load
        generateWorldNodes();
    </script>
</body>
</html>
