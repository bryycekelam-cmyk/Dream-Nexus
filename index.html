<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS BRIDGE | AI-TO-STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root {
            --bg: #0a0a0c;
            --card: #141417;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #f4f4f5;
            height: 100vh;
            overflow: hidden;
        }

        .glass {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .code-font { font-family: 'JetBrains Mono', monospace; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }

        .status-pulse {
            position: relative;
        }
        .status-pulse::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: currentColor;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col p-4 md:p-8">

    <!-- HEADER -->
    <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight uppercase italic">Nexus Bridge</h1>
                <div class="flex items-center gap-2">
                    <div id="status-indicator" class="w-2 h-2 rounded-full bg-red-500 status-pulse"></div>
                    <span id="status-text" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Studio Disconnected</span>
                </div>
            </div>
        </div>

        <div class="flex gap-3">
            <button onclick="openModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all">Get Bridge Script</button>
        </div>
    </header>

    <!-- MAIN GRID -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
        
        <!-- INPUT AREA -->
        <div class="lg:col-span-8 flex flex-col gap-4 overflow-hidden">
            <div class="glass flex-1 rounded-[32px] p-8 flex flex-col relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-indigo-500 to-transparent opacity-50"></div>
                
                <label class="text-[10px] font-bold text-zinc-600 uppercase tracking-[0.2em] mb-4">Prompt Neural Interface</label>
                <textarea id="ai-input" 
                    class="flex-1 bg-transparent border-none focus:ring-0 text-xl md:text-2xl font-semibold placeholder-zinc-800 resize-none outline-none custom-scroll"
                    placeholder="Describe what you want to build in Roblox..."></textarea>
                
                <div class="mt-6 flex items-center justify-between border-t border-zinc-800/50 pt-6">
                    <div class="flex gap-2">
                        <button onclick="addTag('LocalScript')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-lg text-[10px] font-bold hover:border-zinc-600 transition-colors">LOCALSCRIPT</button>
                        <button onclick="addTag('Module')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-lg text-[10px] font-bold hover:border-zinc-600 transition-colors">MODULE</button>
                        <button onclick="addTag('UI')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded-lg text-[10px] font-bold hover:border-zinc-600 transition-colors">UI</button>
                    </div>
                    <button id="generate-btn" onclick="processAIRequest()" class="group relative px-8 py-4 bg-white text-black rounded-2xl font-black text-xs uppercase tracking-widest overflow-hidden hover:scale-105 active:scale-95 transition-all">
                        <span id="btn-label">Transmit to Studio</span>
                        <div class="absolute inset-0 bg-indigo-500 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                        <span class="absolute inset-0 flex items-center justify-center text-white translate-y-full group-hover:translate-y-0 transition-transform duration-300">Initiate Link</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- TELEMETRY / LOGS -->
        <div class="lg:col-span-4 flex flex-col gap-4 overflow-hidden">
            <div class="glass flex-1 rounded-[32px] overflow-hidden flex flex-col">
                <div class="p-5 border-b border-zinc-800/50 flex justify-between items-center">
                    <h3 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Bridge Telemetry</h3>
                    <span id="user-id" class="text-[9px] code-font text-zinc-600 bg-black/40 px-2 py-1 rounded">ID: --</span>
                </div>
                <div id="log-container" class="flex-1 p-5 overflow-y-auto code-font text-[11px] space-y-3 custom-scroll">
                    <div class="text-zinc-600">&gt; System initialized. Awaiting user input.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="bridge-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center p-6 z-50">
        <div class="glass max-w-2xl w-full rounded-[40px] p-10 relative">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-zinc-500 hover:text-white transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            
            <h2 class="text-3xl font-black italic uppercase tracking-tighter mb-2">Bridge Protocol</h2>
            <p class="text-zinc-500 text-xs font-medium mb-8">Paste this script into a <span class="text-indigo-400">Script</span> inside <span class="text-indigo-400">ServerScriptService</span> in Roblox Studio.</p>
            
            <div class="bg-black/60 rounded-2xl p-6 border border-zinc-800 relative group mb-8">
                <pre id="lua-bridge-code" class="text-[10px] code-font text-indigo-300 leading-relaxed overflow-x-auto max-h-60 custom-scroll">-- Generating protocol...</pre>
                <button onclick="copyBridgeScript()" class="absolute top-4 right-4 bg-white text-black px-4 py-2 rounded-xl text-[10px] font-black uppercase opacity-0 group-hover:opacity-100 transition-opacity">Copy Code</button>
            </div>

            <div class="flex items-center gap-4 p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl">
                <div class="text-indigo-400">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-300">Encryption: Active | Firebase Cloud Sync: Enabled</p>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const apiKey = ""; // Handled by environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nexus-bridge-v1';
        const firebaseConfig = JSON.parse(__firebase_config);

        // --- STATE ---
        let db, auth, user;
        const logContainer = document.getElementById('log-container');
        const aiInput = document.getElementById('ai-input');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            const colors = {
                info: 'text-zinc-500',
                ai: 'text-indigo-400',
                success: 'text-emerald-400',
                error: 'text-rose-400'
            };
            div.className = `${colors[type]} border-l-2 border-current pl-3 py-1 animate-in slide-in-from-left duration-300`;
            div.innerHTML = `<span class="opacity-30 text-[9px] block">${new Date().toLocaleTimeString()}</span>${msg}`;
            logContainer.prepend(div);
        }

        async function speak(text) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    })
                });
                const result = await response.json();
                const pcmData = result.candidates[0].content.parts[0].inlineData.data;
                const audioBlob = pcmToWav(pcmData, 24000);
                new Audio(URL.createObjectURL(audioBlob)).play();
            } catch (e) { console.error("TTS Failed", e); }
        }

        function pcmToWav(base64Pcm, sampleRate) {
            const buffer = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0)).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            view.setUint32(0, 0x52494646, false); view.setUint32(4, 36 + buffer.byteLength, true); view.setUint32(8, 0x57415645, false);
            view.setUint32(12, 0x666d7420, false); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false); view.setUint32(40, buffer.byteLength, true);
            return new Blob([wavHeader, buffer], { type: 'audio/wav' });
        }

        // --- FIREBASE LOGIC ---
        async function initFirebase() {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }
            };

            await initAuth();

            auth.onAuthStateChanged(u => {
                user = u;
                if (user) {
                    addLog("Auth verified. Secure connection established.", "success");
                    document.getElementById('user-id').innerText = `ID: ${user.uid.substring(0, 8)}`;
                    startHeartbeatMonitor();
                    generateLuaBridge();
                }
            });
        }

        function startHeartbeatMonitor() {
            // Path Rule 1 & 2
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('status').doc('heartbeat')
                .onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        const isOnline = (Date.now() - data.lastSeen) < 15000;
                        statusIndicator.className = `w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-red-500'} status-pulse`;
                        statusText.innerText = isOnline ? 'Studio Active' : 'Studio Disconnected';
                        statusText.className = `text-[10px] font-bold uppercase tracking-widest ${isOnline ? 'text-emerald-500' : 'text-zinc-500'}`;
                    }
                }, err => console.error("Snapshot error:", err));
        }

        // --- AI LOGIC ---
        async function processAIRequest() {
            const prompt = aiInput.value.trim();
            if (!prompt || !user) return;

            const btn = document.getElementById('generate-btn');
            const btnLabel = document.getElementById('btn-label');
            
            btn.disabled = true;
            btnLabel.innerText = "Synthesizing...";
            addLog("Invoking Gemini 2.5 Brain...", "ai");

            try {
                // RETRY LOGIC for API
                const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                    try {
                        const res = await fetch(url, options);
                        if (!res.ok) throw new Error("API Limit");
                        return await res.json();
                    } catch (err) {
                        if (retries > 0) {
                            await new Promise(r => setTimeout(r, backoff));
                            return fetchWithRetry(url, options, retries - 1, backoff * 2);
                        }
                        throw err;
                    }
                };

                const result = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "You are an expert Roblox Luau developer. Output ONLY clean, functional, and performance-optimized Luau code. No markdown tags, no explanations. Always use local variables." }] }
                    })
                });

                let code = result.candidates[0].content.parts[0].text;
                code = code.replace(/```lua|```/g, "").trim();

                // DEPLOY TO FIRESTORE
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sync').doc('latest').set({
                    code: code,
                    timestamp: Date.now(),
                    prompt: prompt
                });

                addLog("Code deployed to cloud bridge.", "success");
                speak("Synchronization successful. Deploying code to studio.");
                aiInput.value = "";
            } catch (err) {
                addLog("Transmission failed: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btnLabel.innerText = "Transmit to Studio";
            }
        }

        // --- UTILS ---
        function openModal() { document.getElementById('bridge-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('bridge-modal').style.display = 'none'; }
        
        function addTag(tag) {
            aiInput.value += `[${tag}] `;
            aiInput.focus();
        }

        function generateLuaBridge() {
            const lua = `-- NEXUS BRIDGE CLIENT
local HTTP = game:GetService("HttpService")
local ID = "${appId}"
local URL = "https://firestore.googleapis.com/v1/projects/v-canvas-prod/databases/(default)/documents/artifacts/"..ID.."/public/data"

local last_sync = 0

-- Heartbeat
task.spawn(function()
    while true do
        pcall(function()
            HTTP:RequestAsync({
                Url = URL.."/status/heartbeat?updateMask.fieldPaths=lastSeen",
                Method = "PATCH",
                Body = HTTP:JSONEncode({fields={lastSeen={integerValue=os.time()*1000}}})
            })
        end)
        task.wait(10)
    end
end)

-- Sync Listener
print("NEXUS BRIDGE: Listening for AI commands...")
while true do
    local success, response = pcall(function()
        return HTTP:GetAsync(URL.."/sync/latest")
    end)
    
    if success then
        local data = HTTP:JSONDecode(response)
        if data.fields and data.fields.timestamp then
            local ts = tonumber(data.fields.timestamp.doubleValue or data.fields.timestamp.integerValue)
            if ts > last_sync then
                last_sync = ts
                local code = data.fields.code.stringValue
                print("NEXUS BRIDGE: Receiving script...")
                local func, err = loadstring(code)
                if func then 
                    task.spawn(func) 
                else 
                    warn("NEXUS BRIDGE ERROR:", err) 
                end
            end
        end
    end
    task.wait(2)
end`;
            document.getElementById('lua-bridge-code').innerText = lua;
        }

        function copyBridgeScript() {
            const text = document.getElementById('lua-bridge-code').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            addLog("Bridge script copied to clipboard.");
        }

        window.onload = initFirebase;
    </script>
</body>
</html>
