<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Empire: Total War</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap');
        
        /* HERO BREATHING ANIMATION */
        @keyframes idle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.05); }
        }
        .hero-idle { animation: idle 3s ease-in-out infinite; }

        /* MARCHING ANIMATION */
        @keyframes march {
            0% { transform: translateX(0); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: translateX(0); }
        }
        .marching { animation: march 0.5s infinite; }

        .game-ui { font-family: 'Cinzel', serif; background: rgba(0,0,0,0.8); border: 2px solid #b8860b; }
        .map-tile { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#050505] text-white overflow-hidden select-none">

    <div class="h-20 bg-gradient-to-r from-[#2c1e0a] via-[#5c4018] to-[#2c1e0a] border-b-4 border-[#b8860b] flex items-center justify-between px-6 shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
        <div class="flex items-center gap-4">
            <div class="relative group">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=King" class="w-14 h-14 bg-slate-900 rounded-full border-2 border-[#ffd700] hero-idle shadow-[0_0_15px_#ffd700]">
                <div class="absolute -bottom-1 -right-1 bg-red-600 text-[10px] px-1 font-bold rounded">Lv 15</div>
            </div>
            <div>
                <h1 class="text-[#ffd700] font-black italic tracking-tighter text-xl uppercase">Lord Bryyce</h1>
                <div class="flex items-center gap-2">
                    <div class="w-32 h-2 bg-black rounded-full border border-yellow-900 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full w-[85%]"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex gap-4">
            <div class="flex items-center gap-2 bg-black/60 px-4 py-2 rounded-lg border border-cyan-500/50">
                <span class="text-cyan-400 font-black tracking-widest text-lg">💎 <span id="gems">2500</span></span>
            </div>
            <button onclick="upgrade()" class="bg-[#b8860b] hover:bg-[#ffd700] px-6 py-2 rounded font-black text-black transition-all shadow-[0_0_10px_#b8860b]">UPGRADE</button>
        </div>
    </div>

    <div class="relative h-[calc(100vh-280px)] w-full bg-[#1a2e1a] overflow-hidden flex items-center justify-center">
        <div class="absolute inset-0 opacity-40 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]"></div>
        
        <div id="grid" class="grid grid-cols-10 grid-rows-10 w-[800px] h-[800px] gap-1 p-2 transition-transform duration-500">
            </div>
    </div>

    <div class="h-10 bg-black/90 border-t border-[#b8860b]/30 flex items-center px-6 text-[#ffd700] italic text-xs tracking-wider">
        <span class="mr-2">⚔️ SYSTEM:</span> <span id="log">Legions are ready for your command...</span>
    </div>

    <div class="h-44 bg-[#0f0f0f] border-t-4 border-[#b8860b] flex gap-6 p-6">
        <div class="grid grid-cols-3 gap-2 w-36">
            <div=""></div>
            <button onclick="move(0,-1)" class="w-10 h-10 bg-slate-800 rounded border-b-4 border-black hover:bg-yellow-600 active:translate-y-1">▲</button>
            <div=""></div>
            <button onclick="move(-1,0)" class="w-10 h-10 bg-slate-800 rounded border-b-4 border-black hover:bg-yellow-600 active:translate-y-1">◀</button>
            <button onclick="move(0,1)" class="w-10 h-10 bg-slate-800 rounded border-b-4 border-black hover:bg-yellow-600 active:translate-y-1">▼</button>
            <button onclick="move(1,0)" class="w-10 h-10 bg-slate-800 rounded border-b-4 border-black hover:bg-yellow-600 active:translate-y-1">▶</button>
        </div>

        <div class="flex-1 flex gap-4">
            <button onclick="train('INFANTRY')" class="flex-1 bg-gradient-to-b from-red-700 to-red-900 rounded-xl border-b-8 border-red-950 flex flex-col items-center justify-center group">
                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-12 marching group-hover:scale-110 transition">
                <span class="font-black text-[10px] mt-1">TRAIN INFANTRY</span>
            </button>
            <button onclick="train('HERO')" class="flex-1 bg-gradient-to-b from-purple-700 to-purple-900 rounded-xl border-b-8 border-purple-950 flex flex-col items-center justify-center group">
                <img src="https://cdn-icons-png.flaticon.com/512/1030/1030383.png" class="w-12 hero-idle">
                <span class="font-black text-[10px] mt-1">SUMMON HERO</span>
            </button>
        </div>
    </div>

    <script>
        let p = { x: 5, y: 5 };
        let gems = 2500;
        const grid = document.getElementById('grid');
        const log = document.getElementById('log');

        function update() {
            grid.innerHTML = '';
            for(let y=0; y<10; y++) {
                for(let x=0; x<10; x++) {
                    const tile = document.createElement('div');
                    tile.className = "bg-green-900/20 border border-white/5 flex items-center justify-center map-tile hover:bg-yellow-500/20";
                    
                    if(x === p.x && y === p.y) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-10 marching drop-shadow-[0_0_10px_gold]">`;
                    } else if((x+y) % 8 === 0) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/616/616490.png" class="w-8 opacity-20">`;
                    } else if(x === 2 && y === 3) {
                        tile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/2829/2829816.png" class="w-12 hero-idle drop-shadow-lg">`;
                    }
                    grid.appendChild(tile);
                }
            }
            grid.style.transform = `translate(${(5-p.x)*80}px, ${(5-p.y)*80}px)`;
        }

        function move(dx, dy) {
            p.x = Math.max(0, Math.min(9, p.x + dx));
            p.y = Math.max(0, Math.min(9, p.y + dy));
            log.innerText = `General, our legions have reached coordinates ${p.x}, ${p.y}!`;
            update();
        }

        function train(type) {
            log.innerText = `Training ${type}... Estimated time: 2 seconds.`;
            setTimeout(() => { log.innerText = `${type} Recruitment complete!`; }, 2000);
        }

        function upgrade() {
            if(gems >= 1000) {
                gems -= 1000;
                document.getElementById('gems').innerText = gems;
                log.innerText = "Castle upgrade complete! Your power grows!";
                alert("Empire Expanded!");
            }
        }

        update();
    </script>
</body>
</html>
