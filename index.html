<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Developer Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
        }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        .glass {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <!-- Sidebar / Nav -->
    <nav class="fixed top-0 left-0 w-full h-16 glass z-50 flex items-center justify-between px-6 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i data-lucide="cpu" class="w-5 h-5 text-white"></i>
            </div>
            <h1 class="text-lg font-extrabold tracking-tight text-white uppercase">Luau Hub</h1>
        </div>
        <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">System Online</span>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-6 max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left: Input Controls -->
        <div class="lg:col-span-5 space-y-6">
            <div class="glass p-6 rounded-2xl space-y-4">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Neural Input</label>
                    <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <textarea id="prompt-input" 
                    placeholder="E.g., Create a ModuleScript for a custom particle emitter system..."
                    class="w-full h-40 bg-black/40 border border-white/10 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all resize-none placeholder:text-slate-700 text-indigo-50"></textarea>
                
                <button id="generate-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-indigo-600/20">
                    <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
                    <span>GENERATE LUAU</span>
                </button>
            </div>

            <!-- Log Console -->
            <div class="glass rounded-2xl overflow-hidden flex flex-col h-[300px]">
                <div class="px-5 py-3 border-b border-white/5 bg-black/20 flex items-center justify-between">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">System Monitor</span>
                    <button onclick="clearLogs()" class="text-[10px] text-slate-600 hover:text-rose-400 font-bold uppercase">Clear</button>
                </div>
                <div id="console-logs" class="flex-1 p-4 overflow-y-auto space-y-2 code-font text-[11px] text-slate-400">
                    <!-- Logs injection -->
                </div>
            </div>
        </div>

        <!-- Right: Code Output -->
        <div class="lg:col-span-7 h-full">
            <div class="glass rounded-2xl flex flex-col h-full min-h-[600px] border border-white/10 shadow-2xl relative">
                <div class="flex items-center justify-between px-6 py-4 border-b border-white/5">
                    <div class="flex items-center gap-3">
                        <i data-lucide="code-2" class="w-4 h-4 text-indigo-400"></i>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">MainModule.lua</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="copyToClipboard()" class="flex items-center gap-2 px-3 py-1.5 hover:bg-white/5 rounded-lg transition-all text-slate-400 hover:text-white">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span class="text-[10px] font-bold">COPY</span>
                        </button>
                    </div>
                </div>

                <div id="loading-overlay" class="hidden absolute inset-0 z-10 bg-black/60 backdrop-blur-sm items-center justify-center flex-col gap-4">
                    <div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
                    <span class="text-[10px] font-black text-indigo-400 tracking-[0.3em] uppercase animate-pulse">Processing</span>
                </div>

                <pre id="code-display" class="flex-1 p-8 code-font text-sm leading-relaxed overflow-auto text-indigo-100 whitespace-pre-wrap">-- Awaiting input...
-- Generated code will appear here with syntax styling.</pre>
            </div>
        </div>
    </main>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const codeDisplay = document.getElementById('code-display');
        const consoleLogs = document.getElementById('console-logs');
        const loadingOverlay = document.getElementById('loading-overlay');
        const apiKey = ""; // Managed by runtime environment

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString([], { hour12: false });
            const colors = {
                info: 'text-slate-500',
                success: 'text-emerald-400',
                error: 'text-rose-400',
                warn: 'text-amber-400'
            };
            const logEntry = document.createElement('div');
            logEntry.className = 'flex gap-3 leading-tight animate-in fade-in duration-300';
            logEntry.innerHTML = `<span class="text-slate-700 shrink-0">[${time}]</span><span class="${colors[type]}">${msg}</span>`;
            consoleLogs.prepend(logEntry);
        }

        function clearLogs() {
            consoleLogs.innerHTML = '';
            addLog('Console cleared', 'info');
        }

        async function fetchLuau(prompt, attempt = 0) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ text: `Generate a highly optimized, production-ready Roblox Luau script for: ${prompt}. Return ONLY the raw code without any markdown formatting (no backticks). Ensure it uses --!strict for type checking.` }] 
                        }],
                        systemInstruction: { 
                            parts: [{ text: "You are a Master Roblox Engine Engineer. Use proper Luau conventions. No yapping." }] 
                        }
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const code = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (!code) throw new Error("Empty response from engine");
                
                return code.trim();

            } catch (err) {
                if (attempt < 4) {
                    addLog(`Error: ${err.message}. Retrying... (${attempt + 1}/5)`, 'warn');
                    await new Promise(r => setTimeout(r, delays[attempt]));
                    return fetchLuau(prompt, attempt + 1);
                }
                throw err;
            }
        }

        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return addLog('Please enter a prompt', 'warn');

            generateBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
            addLog('Initiating neural synthesis sequence...', 'info');

            try {
                const result = await fetchLuau(prompt);
                codeDisplay.textContent = result;
                addLog('Script synthesized successfully', 'success');
            } catch (err) {
                addLog(`Critical Failure: ${err.message}`, 'error');
            } finally {
                generateBtn.disabled = false;
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
            }
        });

        function copyToClipboard() {
            const text = codeDisplay.textContent;
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            addLog('Copied code to clipboard', 'success');
        }

        // Initial Log
        addLog('Luau Dev Hub kernel initialized', 'info');
    </script>
</body>
</html>
