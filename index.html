<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Bryyce: Kingdom Ruler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Oswald:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; height: 100%; width: 100%; }
        .royal { font-family: 'Cinzel', serif; }

        /* THE WORLD */
        #viewport { width: 100vw; height: 100vh; cursor: grab; overflow: hidden; position: relative; }
        #world-map { width: 4000px; height: 4000px; background: #1a1a1a; position: absolute; transform: translate(-1850px, -1850px); }

        /* EMPEROR UI */
        .emperor-panel {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 10000; display: none; padding: 60px;
        }
        .active-emp { display: flex !important; flex-direction: column; }

        .title-card {
            background: #111; border: 1px solid #333; padding: 20px; border-radius: 12px;
            transition: 0.3s; text-align: center;
        }
        .title-card:hover { border-color: #ffd700; transform: translateY(-5px); }

        /* ANIMATIONS */
        .crown-glow { animation: glow 2s infinite alternate; }
        @keyframes glow { from { filter: drop-shadow(0 0 5px gold); } to { filter: drop-shadow(0 0 30px gold); } }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="world-map">
            <div class="absolute" style="top: 1950px; left: 1950px; width: 150px; text-align: center;">
                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-full crown-glow cursor-pointer" onclick="openEmperorMenu()">
                <div class="bg-yellow-600 text-black font-black text-xs px-2 py-1 rounded">THE ZENITH</div>
            </div>
            <div id="player-castle" class="absolute z-30" style="top: 2200px; left: 2200px;">
                <img src="https://cdn-icons-png.flaticon.com/512/3021/3021703.png" class="w-20 border-2 border-cyan-500 rounded-lg">
                <p class="text-center text-[10px] bg-black/80">BRYYCE [SKY]</p>
            </div>
        </div>
    </div>

    <div id="emp-panel" class="emperor-panel">
        <div class="flex justify-between items-center mb-10 border-b border-yellow-500 pb-5">
            <div>
                <h1 class="royal text-6xl text-yellow-500">THRONE ROOM</h1>
                <p class="text-gray-400">Current Overlord: <span class="text-white font-bold">Lord Bryyce</span></p>
            </div>
            <button onclick="closeEmperorMenu()" class="text-6xl">&times;</button>
        </div>

        <div class="grid grid-cols-4 gap-6">
            <div class="title-card border-green-900">
                <h3 class="text-green-500 font-bold">QUEEN</h3>
                <p class="text-xs text-gray-500 my-2">+15% Construction Speed</p>
                <button onclick="assignTitle('Queen')" class="bg-green-700 w-full py-1 rounded text-xs">ASSIGN</button>
            </div>
            <div class="title-card border-green-900">
                <h3 class="text-green-500 font-bold">GENERAL</h3>
                <p class="text-xs text-gray-500 my-2">+10% Army Attack</p>
                <button onclick="assignTitle('General')" class="bg-green-700 w-full py-1 rounded text-xs">ASSIGN</button>
            </div>

            <div class="title-card border-red-900">
                <h3 class="text-red-600 font-bold">FOOL</h3>
                <p class="text-xs text-gray-500 my-2">-20% Resource Production</p>
                <button onclick="assignTitle('Fool')" class="bg-red-800 w-full py-1 rounded text-xs">PUNISH</button>
            </div>
            <div class="title-card border-red-900">
                <h3 class="text-red-600 font-bold">THIEF</h3>
                <p class="text-xs text-gray-500 my-2">-15% Defense</p>
                <button onclick="assignTitle('Thief')" class="bg-red-800 w-full py-1 rounded text-xs">PUNISH</button>
            </div>
        </div>

        <div class="mt-10 bg-zinc-900 p-8 rounded-2xl">
            <h2 class="royal text-2xl text-yellow-500 mb-4">KINGDOM DECREE</h2>
            <input type="text" id="decree-in" placeholder="Set the law of the land..." class="w-full bg-black border border-yellow-900 p-4 text-white rounded">
            <button onclick="setDecree()" class="mt-4 bg-yellow-600 text-black font-black px-10 py-3 rounded">PUBLISH DECREE</button>
        </div>
    </div>

    <div class="fixed top-6 right-6 z-[500] pointer-events-auto">
        <button onclick="openEmperorMenu()" class="bg-yellow-600 p-4 rounded-full shadow-2xl border-4 border-yellow-400">
            <img src="https://cdn-icons-png.flaticon.com/512/2353/2353361.png" class="w-10">
        </button>
    </div>

    <script>
        const map = document.getElementById('world-map');
        let scrollX = -1850, scrollY = -1850;
        let isDragging = false, startX, startY;

        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('button') || e.target.closest('input')) return;
            isDragging = true; startX = e.pageX - scrollX; startY = e.pageY - scrollY; 
        });
        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            scrollX = e.pageX - startX; scrollY = e.pageY - startY;
            map.style.transform = `translate(${scrollX}px, ${scrollY}px)`;
        });
        window.addEventListener('mouseup', () => isDragging = false);

        function openEmperorMenu() { document.getElementById('emp-panel').classList.add('active-emp'); }
        function closeEmperorMenu() { document.getElementById('emp-panel').classList.remove('active-emp'); }

        function assignTitle(title) {
            const player = prompt("Enter Player Name to receive the title of " + title + ":");
            if(player) alert(player + " has been branded as the " + title + " of Kingdom #442!");
        }

        function setDecree() {
            const msg = document.getElementById('decree-in').value;
            alert("WORLD BROADCAST: " + msg);
            closeEmperorMenu();
        }
    </script>
</body>
</html>
