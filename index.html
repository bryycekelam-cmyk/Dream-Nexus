<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Bryyce: Imperial Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@300;700&display=swap');
        body { background: #050505; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; margin: 0; }
        .royal { font-family: 'Cinzel', serif; }
        
        #viewport { width: 100vw; height: 100vh; background: url('https://i.imgur.com/8T8C9po.jpeg') center; background-size: cover; position: relative; }

        /* MALL UI */
        .mall-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; padding: 40px; }
        .mall-active { display: flex !important; flex-direction: column; }

        .sidebar { width: 200px; border-right: 1px solid rgba(255,215,0,0.2); }
        .tab-btn { padding: 15px; text-align: left; width: 100%; border-bottom: 1px solid #222; font-weight: bold; color: #888; transition: 0.3s; }
        .tab-active { color: #ffd700; background: linear-gradient(90deg, rgba(255,215,0,0.1), transparent); border-left: 4px solid #ffd700; }

        /* PACK CARDS */
        .pack-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #333; border-radius: 12px; overflow: hidden;
            position: relative; transition: 0.3s; cursor: pointer;
        }
        .pack-card:hover { transform: translateY(-5px); border-color: #ffd700; }
        .price-tag { background: #ffd700; color: black; font-weight: 900; padding: 5px 15px; border-radius: 5px; }
        
        /* ITEM LIST */
        .item-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        .item-icon { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #444; }

        /* FLASHY PURCHASE ANIMATION */
        .purchase-flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 3000; }
    </style>
</head>
<body>

    <div id="flash" class="purchase-flash"></div>

    <div class="fixed top-0 w-full z-50 p-6 flex justify-between items-center pointer-events-none">
        <div class="bg-black/90 px-6 py-2 border-b-2 border-yellow-500 rounded-b-xl pointer-events-auto">
            <span class="text-yellow-500 font-black">MIGHT: <span id="might-val">185.2M</span></span>
        </div>
        <div class="bg-black/90 px-6 py-2 border-b-2 border-cyan-500 rounded-b-xl pointer-events-auto">
            <span class="text-cyan-400 font-black">💎 <span id="gem-val">520,000</span></span>
        </div>
    </div>

    <div id="viewport">
        <button onclick="toggleMall()" class="absolute bottom-10 right-10 bg-yellow-600 p-6 rounded-full shadow-2xl animate-bounce hover:scale-110 transition">
            <span class="text-3xl">🛒</span>
            <p class="text-[10px] font-black text-black">MALL</p>
        </button>
    </div>

    <div id="mall" class="mall-overlay">
        <div class="flex justify-between items-center mb-6">
            <h2 class="royal text-4xl text-yellow-500">Imperial Mall</h2>
            <button onclick="toggleMall()" class="text-5xl text-gray-500 hover:text-white">&times;</button>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="sidebar">
                <div class="tab-btn tab-active">FEATURED</div>
                <div class="tab-btn">HERO PACKS</div>
                <div class="tab-btn">RESOURCES</div>
                <div class="tab-btn">EQUIPMENT</div>
            </div>

            <div class="flex-1 p-8 overflow-y-auto grid grid-cols-2 gap-8" id="pack-container">
                <div class="pack-card p-6" id="pack-gems" onclick="buyPack('gems')">
                    <div class="absolute top-0 right-0 bg-red-600 text-[10px] px-3 py-1 font-bold italic">POPULAR!</div>
                    <h3 class="royal text-2xl mb-4" id="gem-pack-title">Gem Packed ($4.99)</h3>
                    <div class="item-row">
                        <div class="item-icon bg-cyan-900"></div> 
                        <span>Gems: <b class="text-cyan-400" id="gem-pack-amt">+20,000</b></span>
                    </div>
                    <div class="item-row">
                        <div class="item-icon bg-blue-900"></div> 
                        <span>Speed Ups: <b class="text-blue-300">24 Hours</b></span>
                    </div>
                    <div class="mt-6 flex justify-between items-center">
                        <span class="text-gray-500 line-through text-xs">$19.99</span>
                        <div class="price-tag">FREE (TEST)</div>
                    </div>
                </div>

                <div class="pack-card p-6" onclick="buyPack('mats')">
                    <h3 class="royal text-2xl mb-4">Material Madness</h3>
                    <div class="item-row">
                        <div class="item-icon bg-purple-900"></div> 
                        <span>Rare Chests: <b class="text-purple-400">x50</b></span>
                    </div>
                    <div class="item-row">
                        <div class="item-icon bg-orange-900"></div> 
                        <span>Legendary Ember: <b class="text-orange-400">x5</b></span>
                    </div>
                    <div class="mt-6 flex justify-between items-center">
                        <span class="text-gray-500 line-through text-xs">$99.99</span>
                        <div class="price-tag">FREE (TEST)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let totalGems = 520000;
        let totalMight = 185200000;
        let gemPackTier = 0;
        const gemTiers = [
            { title: "Gem Packed ($4.99)", gems: 20000, next: "Gem Packed ($19.99)" },
            { title: "Gem Packed ($19.99)", gems: 85000, next: "Gem Packed ($49.99)" },
            { title: "Gem Packed ($49.99)", gems: 250000, next: "Gem Packed ($99.99)" },
            { title: "Gem Packed ($99.99)", gems: 600000, next: "MAXED" }
        ];

        function toggleMall() { document.getElementById('mall').classList.toggle('mall-active'); }

        function buyPack(type) {
            // Visual Flash Effect
            const flash = document.getElementById('flash');
            flash.style.opacity = "1";
            setTimeout(() => flash.style.opacity = "0", 100);

            if (type === 'gems') {
                const current = gemTiers[gemPackTier];
                totalGems += current.gems;
                totalMight += (current.gems / 10); // 200+ Idea: Gems increase Might

                // Scaling Logic
                if (gemPackTier < gemTiers.length - 1) {
                    gemPackTier++;
                    document.getElementById('gem-pack-title').innerText = gemTiers[gemPackTier].title;
                    document.getElementById('gem-pack-amt').innerText = "+" + gemTiers[gemPackTier].gems.toLocaleString();
                }
            } else if (type === 'mats') {
                totalMight += 5000000; // Material madness gives massive might boost
            }

            // Update HUD
            document.getElementById('gem-val').innerText = totalGems.toLocaleString();
            document.getElementById('might-val').innerText = (totalMight / 1000000).toFixed(1) + "M";
            
            alert("PURCHASE SUCCESSFUL! Items added to account.");
        }
    </script>
</body>
</html>
