<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign Bryyce: Beautiful Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Oswald:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; background: #0a0a0c; color: white; font-family: 'Oswald', sans-serif; overflow: hidden; height: 100%; width: 100%; }
        
        /* THE STABLE VIEWPORT */
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; z-index: 1; }

        /* THE REINFORCED MAP */
        #world-map { 
            width: 4000px; height: 4000px; 
            background: #151a21 radial-gradient(#2a3441 1px, transparent 1px);
            background-size: 50px 50px;
            position: absolute; top: 0; left: 0;
            will-change: transform; transform: translate(-1800px, -1800px);
        }

        /* CUSTOM ASSET STYLING (No more boring icons!) */
        .castle-player { 
            width: 100px; height: 100px; background: url('https://i.imgur.com/rM7s21j.png') center / contain no-repeat;
            filter: drop-shadow(0 0 15px #60a5fa);
            animation: pulse-castle 2s infinite alternate;
        }
        @keyframes pulse-castle { 0% { transform: scale(1); filter: drop-shadow(0 0 10px #60a5fa); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 25px #3b82f6); } }
        
        .zenith-tower { 
            width: 180px; height: 180px; background: url('https://i.imgur.com/vHq7FfN.png') center / contain no-repeat;
            filter: drop-shadow(0 0 20px #fbbf24); 
            animation: pulse-zenith 2.5s infinite alternate;
        }
        @keyframes pulse-zenith { 0% { transform: scale(1); filter: drop-shadow(0 0 20px #fbbf24); } 100% { transform: scale(1.07); filter: drop-shadow(0 0 40px #f59e0b); } }

        .map-node { position: absolute; z-index: 10; cursor: pointer; text-align: center; transform: translate(-50%, -50%); }
        .label { background: rgba(0,0,0,0.85); border: 1px solid #ffd700; color: #ffd700; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-top: 5px; font-weight: bold; }

        /* HUD */
        #ui-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
        .ui-btn { pointer-events: auto; cursor: pointer; transition: 0.2s; }
        .ui-btn:hover { transform: scale(1.05); filter: brightness(1.2); }

        /* MODALS */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); 
            z-index: 2000; display: none; align-items: center; justify-content: center; pointer-events: auto;
        }
        .active-modal { display: flex; }

        /* SHIELD EFFECTS */
        #player-castle.shielded .castle-player {
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.7); /* Cyan glowing effect */
            border: 3px solid cyan; /* Optional: border to highlight shield */
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="world-map">
            <div class="map-node" style="top: 2000px; left: 2000px;" onclick="focusObj('Zenith')">
                <div class="zenith-tower"></div>
                <div class="label">THE WORLD ZENITH</div>
            </div>

            <div id="player-castle" class="map-node" style="top: 2200px; left: 2200px;" onclick="focusObj('Home')">
                <div class="castle-player"></div>
                <div class="label">BRYYCE [SKY]</div>
            </div>
        </div>
    </div>

    <div id="ui-overlay">
        <div class="p-4 flex justify-between items-start">
            <div class="bg-gradient-to-r from-gray-900 to-transparent p-3 border-l-4 border-yellow-500 rounded-r-lg shadow-xl ui-btn">
                <p class="text-xs text-gray-300">LORD BRYYCE</p>
                <p class="text-yellow-500 font-bold text-xl">MIGHT: 185.2M</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-black/90 px-6 py-2 border-b-2 border-cyan-500 text-cyan-400 font-black text-xl rounded-lg shadow-md ui-btn">💎 520,000</div>
                <button onclick="toggleModal('mall')" class="bg-gradient-to-br from-purple-700 to-pink-600 px-8 py-3 rounded-full font-black text-sm shadow-lg transform hover:scale-105 transition-all ui-btn">🛒 MALL</button>
            </div>
        </div>

        <div class="absolute bottom-44 right-6 flex flex-col gap-3">
            <button onclick="recallCamera()" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-bold shadow-lg ui-btn hover:bg-blue-700">🏠 RECALL</button>
            <button onclick="toggleShield()" id="shield-btn" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold shadow-lg ui-btn hover:bg-emerald-700">🛡️ ACTIVATE SHIELD</button>
        </div>

        <div class="absolute bottom-6 left-6 bg-black/90 p-4 border border-white/20 rounded-xl ui-btn flex flex-col gap-2">
            <p class="text-[10px] text-gray-400 uppercase">Current Sector</p>
            <p class="text-yellow-500 font-bold font-mono text-lg">X: <span id="ui-x">2200</span> Y: <span id="ui-y">2200</span></p>
            <div class="flex gap-2">
                <input id="tp-x" type="number" placeholder="X" class="w-20 bg-zinc-800 p-2 text-sm rounded">
                <input id="tp-y" type="number" placeholder="Y" class="w-20 bg-zinc-800 p-2 text-sm rounded">
                <button onclick="teleport()" class="bg-cyan-700 px-4 rounded font-bold text-sm hover:bg-cyan-800">WARP</button>
            </div>
        </div>
    </div>

    <div id="modal-mall" class="modal" onclick="closeAll(event)">
        <div class="relative bg-gradient-to-br from-purple-900 to-indigo-900 w-full max-w-4xl h-[90%] p-10 border-4 border-purple-500 rounded-3xl shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="toggleModal('mall')" class="absolute top-4 right-4 text-4xl text-gray-300 hover:text-white">&times;</button>
            
            <div class="flex items-center justify-center mb-10">
                <img src="https://cdn-icons-png.flaticon.com/512/3593/3593452.png" class="w-20 h-20 mr-4 filter drop-shadow(0 0 15px magenta)">
                <h2 class="royal text-6xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-orange-500">IMPERIAL MARKET</h2>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-3 gap-8 overflow-y-auto h-[calc(100%-150px)] pr-4">
                <div class="bg-purple-900/50 backdrop-blur-sm p-8 rounded-xl border border-purple-700 shadow-lg text-center transform hover:scale-105 transition-all duration-200">
                    <img src="https://cdn-icons-png.flaticon.com/512/1065/1065500.png" class="w-24 mx-auto mb-4 filter drop-shadow(0 0 10px cyan)">
                    <h3 class="text-3xl font-bold text-cyan-400 mb-2">💎 Gem Bundle</h3>
                    <p class="text-gray-300 text-sm">A treasure chest of pure magic.</p>
                    <p class="text-5xl font-black text-white my-6">100K</p>
                    <button onclick="alert('Gems Acquired!')" class="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white font-black py-4 rounded-full text-xl shadow-md">BUY NOW</button>
                </div>
                <div class="bg-purple-900/50 backdrop-blur-sm p-8 rounded-xl border border-purple-700 shadow-lg text-center transform hover:scale-105 transition-all duration-200">
                    <img src="https://cdn-icons-png.flaticon.com/512/2907/2907572.png" class="w-24 mx-auto mb-4 filter drop-shadow(0 0 10px red)">
                    <h3 class="text-3xl font-bold text-red-400 mb-2">⚔️ Troop Pack</h3>
                    <p class="text-gray-300 text-sm">Elite soldiers ready for battle.</p>
                    <p class="text-5xl font-black text-white my-6">50K T4</p>
                    <button onclick="alert('Troops Recruited!')" class="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-black py-4 rounded-full text-xl shadow-md">RECRUIT</button>
                </div>
                <div class="bg-purple-900/50 backdrop-blur-sm p-8 rounded-xl border border-purple-700 shadow-lg text-center transform hover:scale-105 transition-all duration-200">
                    <img src="https://cdn-icons-png.flaticon.com/512/9639/9639088.png" class="w-24 mx-auto mb-4 filter drop-shadow(0 0 10px gold)">
                    <h3 class="text-3xl font-bold text-yellow-400 mb-2">⚡ Speedup Crate</h3>
                    <p class="text-gray-300 text-sm">Accelerate your empire's progress.</p>
                    <p class="text-5xl font-black text-white my-6">24hr x5</p>
                    <button onclick="alert('Speedups Granted!')" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 text-white font-black py-4 rounded-full text-xl shadow-md">ACCELERATE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = document.getElementById('world-map');
        const castle = document.getElementById('player-castle');
        const shieldBtn = document.getElementById('shield-btn');
        
        let isDragging = false;
        let startX, startY;
        let scrollX = -1800, scrollY = -1800; // Tracked camera position
        let playerX = 2200, playerY = 2200; // Tracked castle position
        let isUIOpen = false;
        let isShieldActive = false;

        // Initial Map Position
        updateDisplay();

        // 1. UPDATE DISPLAY LOOP
        function updateDisplay() {
            map.style.transform = `translate(${scrollX}px, ${scrollY}px)`;
            
            const centerX = Math.abs(scrollX) + (window.innerWidth / 2);
            const centerY = Math.abs(scrollY) + (window.innerHeight / 2);
            
            document.getElementById('ui-x').innerText = Math.round(centerX);
            document.getElementById('ui-y').innerText = Math.round(centerY);
        }

        // 2. DRAGGING LOGIC
        window.addEventListener('mousedown', (e) => {
            if (isUIOpen || e.target.closest('.ui-btn') || e.target.closest('.modal')) return;
            isDragging = true;
            startX = e.clientX - scrollX;
            startY = e.clientY - scrollY;
            map.style.transition = "none";
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isUIOpen) return;
            scrollX = e.clientX - startX;
            scrollY = e.clientY - startY;

            scrollX = Math.min(0, Math.max(scrollX, -(4000 - window.innerWidth)));
            scrollY = Math.min(0, Math.max(scrollY, -(4000 - window.innerHeight)));
            
            updateDisplay();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // 3. NAVIGATION TOOLS
        function recallCamera() {
            map.style.transition = "transform 0.5s ease-out";
            scrollX = -(playerX - (window.innerWidth / 2));
            scrollY = -(playerY - (window.innerHeight / 2));
            updateDisplay();
        }

        function goToZenith() {
            map.style.transition = "transform 0.5s ease-out";
            scrollX = -(2000 - (window.innerWidth / 2));
            scrollY = -(2000 - (window.innerHeight / 2));
            updateDisplay();
        }

        function teleport() {
            const tx = parseInt(document.getElementById('tp-x').value);
            const ty = parseInt(document.getElementById('tp-y').value);
            if(isNaN(tx) || isNaN(ty)) return alert("Enter valid X, Y coordinates!");

            playerX = tx; playerY = ty;
            castle.style.left = playerX + "px";
            castle.style.top = playerY + "px";
            
            recallCamera();
            alert("Strategic Warp Complete.");
        }

        // 4. INTERACTION & UI
        function focusObj(name) {
            if(isDragging) return;
            if (name === 'Home') alert("Lord Bryyce's Imperial Fortress!");
            else if (name === 'Zenith') alert("The legendary World Zenith! Only the strongest may conquer.");
        }

        function toggleModal(id) {
            const m = document.getElementById('modal-' + id);
            m.classList.toggle('active-modal');
            isUIOpen = m.classList.contains('active-modal');
        }

        function closeAll(e) {
            if(e.target.classList.contains('modal')) {
                e.target.classList.remove('active-modal');
                isUIOpen = false;
            }
        }

        // 5. SHIELD SYSTEM
        function toggleShield() {
            isShieldActive = !isShieldActive;
            if (isShieldActive) {
                castle.classList.add('shielded');
                shieldBtn.innerText = "🛡️ SHIELD ACTIVE (24h)";
                shieldBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                shieldBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                alert("Your castle is now protected for 24 hours!");
            } else {
                castle.classList.remove('shielded');
                shieldBtn.innerText = "🛡️ ACTIVATE SHIELD";
                shieldBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                shieldBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                alert("Shield deactivated. Beware, my Lord!");
            }
        }
    </script>
</body>
</html>
